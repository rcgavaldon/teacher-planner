<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Deck demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  html,body{margin:0;background:#0b0f24}
  @page{size:13.333in 7.5in;margin:0}
  .spage{position:static!important;width:13.333in;height:7.5in;overflow:hidden;break-after:page}
  .spage:last-child{break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
</head><body>
<div id="app"></div>
<script src="../deck-plot.js"></script>
<script>
const DECK={ course:"Pre-Calculus", title:"Quadratic Functions", kind:"launch", slides:[
 { type:"hook", heading:"Why does everything you throw come back down — in a curve?",
   bullets:["A thrown ball, a fountain, a bridge cable, a profit model — same shape.","That shape is a **parabola**, and this week we learn to read it and build it.","By Friday you'll graph one from an equation and find its highest point."],
   graph:{kind:"parabola",a:-0.45,b:1.8,c:1,domain:[-0.5,4.5]}, graphCaption:"height vs. time of a thrown ball" },
 { type:"define", heading:"The quadratic function",
   bullets:["Standard form: $f(x)=ax^2+bx+c$, with $a\\neq 0$.","The graph is always a **parabola**.","$a>0$ opens up (a valley); $a<0$ opens down (a hill).","$|a|$ controls how narrow or wide it is."],
   graph:{kind:"parabola",a:1,b:0,c:0,domain:[-4,4],marks:[{x:0,y:0,label:"vertex"}]}, graphCaption:"the parent graph  y = x²" },
 { type:"example", heading:"Graph  f(x) = x² − 4x + 3",
   example:"**1.** Axis of symmetry: $x=-\\dfrac{b}{2a}=-\\dfrac{-4}{2}=2$.\n**2.** Vertex $y$: $f(2)=4-8+3=-1 \\Rightarrow (2,-1)$.\n**3.** Zeros: $x^2-4x+3=(x-1)(x-3)=0 \\Rightarrow x=1,\\,3$.\n**4.** $y$-intercept: $f(0)=3$.",
   graph:{kind:"parabola",a:1,b:-4,c:3,domain:[-1,5],marks:[{x:2,y:-1,label:"(2, −1)"},{x:1,y:0,label:"1"},{x:3,y:0,label:"3"}]}, graphCaption:"vertex (2, −1) · roots 1 and 3" },
 { type:"mistake", heading:"The one sign error everyone makes",
   mistake:"The axis of symmetry is $x=-\\dfrac{b}{2a}$ — that leading **minus** is part of the formula.\nFor $f(x)=x^2-4x+3$, $b=-4$, so $x=-\\dfrac{-4}{2}=+2$, **not** $-2$.",
   note:"Write the negative first, then substitute $b$. Two negatives make the positive." },
 { type:"youtry", heading:"Your turn",
   youTry:"Graph $f(x)=x^2-2x-3$.\nFind: (a) the axis of symmetry, (b) the vertex, (c) the zeros.",
   graph:{kind:"parabola",a:1,b:-2,c:-3,domain:[-3,5]}, graphCaption:"sketch it, then check against the screen" },
 { type:"vocab", heading:"Words we'll use all unit",
   vocab:[{term:"Parabola",definition:"the U-shaped graph of a quadratic"},{term:"Vertex",definition:"the highest or lowest point"},{term:"Axis of symmetry",definition:"the vertical line through the vertex"},{term:"Zeros / roots",definition:"where the graph crosses the x-axis"},{term:"Standard form",definition:"$f(x)=ax^2+bx+c$"}] },
 { type:"roadmap", heading:"Where we're headed this week",
   bullets:["**Mon** — graph from standard form (today).","**Tue** — vertex form and transformations.","**Wed** — solve by factoring & the quadratic formula.","**Thu** — real-world max/min (projectile & profit).","**Fri** — quiz + a modeling challenge."],
   video:{title:"Warm-up video: parabolas in real life (3 min)",url:"https://www.youtube.com/results?search_query=parabolas+in+real+life"} }
]};
function build(){
  const app=document.getElementById("app"); const n=DECK.slides.length;
  app.innerHTML=DECK.slides.map((s,i)=>{
    const pct=Math.round((i+1)/n*100);
    return '<div class="deckshow spage">'
      +'<div class="deckbar"><div class="f" style="width:'+pct+'%"></div></div>'
      +'<div class="deckstage">'+window.slideEl(s,i,n)+'</div>'
      +'<div class="deckfoot"><span class="dtitle">'+DECK.course+' · '+DECK.title+'</span><span>'+(i+1)+' / '+n+'</span></div>'
      +'</div>';
  }).join("");
  if(window.renderMathInElement) window.renderMathInElement(app,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false});
}
if(document.readyState!=="loading") setTimeout(build,60); else window.addEventListener("DOMContentLoaded",()=>setTimeout(build,60));
</script>
</body></html>

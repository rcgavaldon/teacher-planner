/* coherence self-audit — a quick second pass that rewrites any modeled example which pre-solves/pre-teaches a
   worksheet or challenge item (the residual defect prompt rules alone don't reliably prevent). Key-holders only
   (skipped on the no-key bridge so it never triggers a second paste). Best-effort; never blocks a save. */
async function coherenceAudit(co,d){
  if(!(S.settings&&S.settings.apiKey)) return d;                 // don't add a paste round-trip on the bridge
  const items=[];
  (d.guidedNotes&&d.guidedNotes.examples||[]).forEach(e=>items.push({label:'gnEx'+items.length,text:e.prompt,set:v=>e.prompt=v}));
  (d.guidedNotes&&d.guidedNotes.youTry||[]).forEach(y=>items.push({label:'gnYT'+items.length,text:y.prompt,set:v=>y.prompt=v}));
  (d.procedureExamples||[]).forEach(e=>items.push({label:'proc'+items.length,text:e.prompt,set:v=>e.prompt=v}));
  (d.presentation&&d.presentation.slides||[]).forEach(s=>{ if(s.example)items.push({label:'slEx'+items.length,text:s.example,set:v=>s.example=v}); if(s.youTry)items.push({label:'slYT'+items.length,text:s.youTry,set:v=>s.youTry=v}); if(s.mistake)items.push({label:'slMis'+items.length,text:s.mistake,set:v=>s.mistake=v}); });
  const problems=[]; (d.worksheet&&d.worksheet.sections||[]).forEach(s=>(s.problems||[]).forEach(p=>problems.push(p)));
  (d.worksheet&&d.worksheet.optionalExtra||[]).forEach(p=>problems.push(p)); if(d.extension&&d.extension.prompt)problems.push('CHALLENGE: '+d.extension.prompt);
  if(items.length<2||problems.length<2) return d;
  const txt=await callClaude({max_tokens:2500,
    system:"You fix lesson coherence for a picky teacher. RULE: a worked/modeled example (I-do, You-Try, or slide) must NEVER be the same problem as a worksheet or challenge item — not the same scenario, entities, numbers, or final answer — and a challenge/optionalExtra must stay UNSEEN (never pre-taught in notes or a mistake slide). Return ONLY JSON.",
    messages:[{role:'user',content:`MODELED items (label: text):\n${items.map(it=>it.label+': '+String(it.text||"").slice(0,240)).join('\n')}\n\nWORKSHEET + CHALLENGE problems:\n${problems.map((p,i)=>(i+1)+'. '+String(p).slice(0,240)).join('\n')}\n\nFor EVERY modeled item whose scenario/entities/numbers/answer DUPLICATES or PRE-TEACHES a worksheet/challenge problem, REWRITE that modeled item to a fresh PARALLEL example (same skill and subtype, DIFFERENT context and numbers, never reusing a worksheet problem). Keep any $...$ math valid and self-consistent. Return JSON: {"fixes":[{"label":"gnEx0","replacement":"rewritten text"}]} — include ONLY items you actually changed; empty array if all clean.`}]});
  try{ const r=parseJSON(txt); (r.fixes||[]).forEach(f=>{const it=items.find(x=>x.label===f.label); if(it&&f.replacement&&String(f.replacement).trim())it.set(String(f.replacement));}); }catch(e){}
  return d;
}

function showVerifyReview(mats,r){
  const ws=mats.worksheet||{}; const secs=r.sections||[];
  let anyDiff=false, anyCount=false;
  const rows=secs.map(s=>{
    const orig=(mats.answerKey||[]).find(k=>(k.section||"")===(s.section||""))||{};
    const provided=orig.answers||[]; const resolved=s.resolved||[];
    const wsSec=(ws.sections||[]).find(x=>(x.type||"")===(s.section||""));
    const probCount=wsSec?(wsSec.problems||[]).length:Math.max(provided.length,resolved.length);
    const countBad=probCount&&resolved.length!==probCount; if(countBad)anyCount=true;
    const items=resolved.map((a,i)=>{const same=(s.matches&&s.matches[i]!==undefined)?s.matches[i]!==false:(provided[i]===a);if(!same)anyDiff=true;
      return `<tr class="${same?'':'diff'}"><td>${i+1}</td><td>${esc(provided[i]||'—')}</td><td>${esc(a||'—')}</td><td>${same?'✓':'✗'}</td></tr>`;}).join("");
    return `<div style="margin:10px 0"><b>${esc(s.section||'Section')}</b>${countBad?` <span class="pill red">⚠ ${resolved.length} answers vs ${probCount} problems</span>`:''}
      ${s.notes?`<div class="sub">${esc(s.notes)}</div>`:''}
      <table class="vocab"><tr><th>#</th><th>Your key</th><th>Re-solved</th><th></th></tr>${items}</table></div>`;
  }).join("");
  const ov=el(`<div class="overlay" id="vrev"><div class="modal">
    <h3>Answer-key check ${anyDiff||anyCount?'<span class="pill red">review needed</span>':'<span class="pill green">all match</span>'}</h3>
    <p class="sub">Independent re-solve vs your key. <b>Nothing changes unless you apply it.</b></p>
    ${rows||'<p class="sub">No key to compare.</p>'}
    <div class="btnbar" style="margin-top:12px">${anyDiff?'<button class="btn" id="vapply">Apply re-solved key</button>':''}<button class="btn ghost" id="vkeep">Keep my key</button></div></div></div>`);
  document.body.appendChild(ov);
  $("#vkeep",ov).onclick=()=>ov.remove();
  const ap=$("#vapply",ov); if(ap)ap.onclick=()=>{mats._keyBackup=JSON.parse(JSON.stringify(mats.answerKey||[]));mats.answerKey=secs.map(s=>({section:s.section,answers:s.resolved}));ov.remove();save();render();toast("Re-solved key applied — your old key is backed up");};
}

/* ---- LaTeX export in Robert's Overleaf style ---- */
function latexEscapeText(t){
  // 1) convert unicode pdflatex can't render: 🌶 -> challenge marker, math symbols -> $..$, strip other emoji.
  //    map wanted symbols to control-char sentinels first so escaping doesn't mangle the LaTeX we insert.
  t=(t||"")
    .replace(/🌶️?\s*/g,"")
    .replace(/[‘’]/g,"\x27").replace(/[“”]/g,String.fromCharCode(34))
    .replace(/—/g,"---").replace(/–/g,"--").replace(/…/g,"...").replace(/−/g,"-")
    .replace(/→/g,"").replace(/⇒/g,"").replace(/≠/g,"")
    .replace(/≤/g,"").replace(/≥/g,"").replace(/×/g,"")
    .replace(/∞/g,"").replace(/π/g,"").replace(/°/g,"")
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️‍]/gu,"");
  // 2) escape LaTeX specials
  t=t.replace(/\\/g,"\\textbackslash{}").replace(/([&%#_{}$])/g,"\\$1").replace(/\^/g,"\\textasciicircum{}").replace(/~/g,"\\textasciitilde{}");
  // 3) restore sentinels as real LaTeX
  return t.replace(//g,"\\textbf{(challenge)} ").replace(//g,"$\\to$").replace(//g,"$\\Rightarrow$")
    .replace(//g,"$\\ne$").replace(//g,"$\\le$").replace(//g,"$\\ge$").replace(//g,"$\\times$")
    .replace(//g,"$\\infty$").replace(//g,"$\\pi$").replace(//g,"$^\\circ$");
}
function mdToLatex(s){
  s=(s||"").replace(/\r/g,"");
  // protect math, escape prose, then convert **bold** (so bold can span a $...$ boundary), then restore math
  const math=[];
  s=s.replace(/(\$\$[\s\S]*?\$\$|\$[^$\n]*\$)/g,m=>{math.push(m);return "␀"+(math.length-1)+"␀";});
  let t=latexEscapeText(s);
  t=t.replace(/\*\*([^*]+)\*\*/g,"\\textbf{$1}");
  t=t.replace(/␀(\d+)␀/g,(_,i)=>{const m=math[+i];return /^\$\$[\s\S]*\$\$$/.test(m)?("\\["+m.slice(2,-2)+"\\]"):m;});
  return t;
}
/* exports a .tex that compiles to Robert's EXACT worksheet style (see his rational/main.tex):
   centered title -> bold "Example (type):" worked example -> \hrule -> bold Directions ->
   two-column enumerate with itemsep=2.8cm work space -> \newpage -> Answer Key and Procedure page */
function stripExampleLabel(s){return String(s||"").replace(/^\s*\**\s*(worked\s+)?example\b\s*(\([^)]*\))?\s*:?\s*\**\s*/i,"").trim();}
/* a worksheet problem may be pure math or math+prose — render each correctly for LaTeX */
function problemLatex(p){
  let t=String(p||"").trim();
  let pre="";
  const cm=t.match(/^🌶️?\s*/);                                                              // pull the challenge marker out of the math
  if(cm){ pre="\\textbf{(challenge)}\\ "; t=t.slice(cm[0].length).trim(); }
  const one=t.match(/^\$([\s\S]*)\$$/);
  if(one && (one[1].match(/\$/g)||[]).length===0) return pre+"$\\displaystyle "+one[1]+"$";  // a single $...$ segment
  if(!/\$/.test(t)) return pre+(/[a-zA-Z]{3,}/.test(t.replace(/\\[a-zA-Z]+/g,""))?mdToLatex(t):"$\\displaystyle "+t+"$"); // prose vs bare math
  return pre+mdToLatex(t);                                                                    // mixed math + prose
}
/* draw a REAL graph with pgfplots/tikz from a diagram spec (not a placeholder box).
   d = {xmin,xmax,ymin,ymax,width,height,xtick,ytick,samples,caption,
        plots:[{expr,domain:[a,b],color,dashed}] | expr+domain shorthand,
        points:[[x,y,"label","color"]]}  — expr uses pgfplots syntax (x^2+5*x+6). */
function tikzFor(d){
  if(!d) return "";
  const g=Object.assign({xmin:-6,xmax:6,ymin:-6,ymax:6,width:"10cm",height:"5.2cm",samples:80},d);
  const dim=(v,cap)=>{ let n=parseFloat(String(v==null?"":v)); if(!isFinite(n)||n<=0)n=cap*0.65; if(n>cap)n=cap; return (Math.round(n*10)/10)+"cm"; };  // page-safe: the model sometimes emits pixel-scale (220) -> clamp so the graph fits the sheet
  const tick=(k,v)=>{ if(v==null||v==="")return ""; v=String(v); return v.indexOf(",")>=0?(k+"={"+v+"},"):(k+" distance="+v+","); }; // 1 -> "xtick distance=1"
  const plots=g.plots||(g.expr?[{expr:g.expr,domain:g.domain,color:"blue"}]:[]);
  const o=["\\begin{center}\\begin{tikzpicture}"];
  o.push("\\begin{axis}[axis lines=middle,xlabel=$x$,ylabel=$y$,xmin="+g.xmin+",xmax="+g.xmax+",ymin="+g.ymin+",ymax="+g.ymax

/* turn "{{answer}}" / "{{answer|1.8cm}}" cloze markers into \bl blanks; render the rest as prose+math.
   \bl prints a blank on the student copy and the blue answer on the teacher key.
   Robust to a blank written INSIDE a $...$ span (e.g. "$a={{$1$}}$"): tokens are pulled out first so the
   answer's own $ can't confuse math detection, then math is closed around each blank so it never prints broken. */
function clozeToLatex(str){
  str=String(str||"").replace(/\r/g,"");
  const toks=[];  // pull cloze tokens out (protect their internal $) -> placeholder  i 
  str=str.replace(/\{\{((?:[^{}]|\{[^{}]*\})*?)(?:\|([^{}|]*))?\}\}/g,(m,a,w)=>{toks.push({a:a,w:w||"2cm"});return ""+(toks.length-1)+"";});
  const blk=t=>"\\bl["+t.w+"]{"+mdToLatex(t.a)+"}";
  let res="", inMath=false, buf="";
  const flush=()=>{ if(buf===""){return;} res+=(inMath?("$"+buf+"$"):mdToLatex(buf)); buf=""; };
  for(let i=0;i<str.length;i++){ const c=str[i];
    if(c===""){ const j=str.indexOf("",i+1); const t=toks[+str.slice(i+1,j)]; i=j;
      flush(); res+=blk(t); continue; }              // blank sits in TEXT mode; math reopens on the next $-run
    if(c==="$"){ flush(); inMath=!inMath; continue; } // toggle math; flush the completed run
    buf+=c;
  }
  flush();
  return res.replace(/\$\s*\$/g,"");                  // drop empty math left when a blank ended a span
}

/* markdown notes -> LaTeX body (headings, lists, bold, $...$) */
function mdNotesToLatex(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n"); const o=[]; let inList=false;
  const close=()=>{if(inList){o.push("\\end{itemize}");inList=false;}};
  for(const ln of lines){ let m;
    if((m=ln.match(/^\s*#{1,6}\s*(.*)/))){close();o.push("");o.push("{\\large\\textbf{"+mdToLatex(m[1])+"}}\\par\\smallskip");continue;}
    if((m=ln.match(/^\s*[-*]\s+(.*)/))){if(!inList){o.push("\\begin{itemize}[leftmargin=1.4em]");inList=true;}o.push("  \\item "+mdToLatex(m[1]));continue;}
    if(ln.trim()===""){close();o.push("");continue;}
    close();o.push(mdToLatex(ln)+"\\par");
  }
  close(); return o.join("\n");
}

/* ---- LaTeX -> PDF via texlive.net (full TeX Live incl. tcolorbox). Uses a form-POST navigation into a
   new tab (browsers don't apply CORS to navigations), so it works from a hosted app AND double-clicked. ---- */
function compileTexToPDF(tex,base,btn,statusEl){
  const say=m=>{ if(statusEl)statusEl.innerHTML=m; };
  try{
    const f=document.createElement("form");
    f.method="POST"; f.action="https://texlive.net/cgi-bin/latexcgi"; f.target="_blank";
    const add=(n,v)=>{const i=document.createElement("input");i.type="hidden";i.name=n;i.value=v;f.appendChild(i);};
    add("filecontents[]",tex); add("filename[]","document.tex"); add("engine","pdflatex"); add("return","pdf");
    document.body.appendChild(f);
    const w=f.submit();  // opens a new tab that compiles + shows the PDF
    f.remove();
    say('<span style="color:var(--green)">✓ Compiling on texlive.net — your PDF opens in a NEW TAB (allow pop-ups). Save/print it from there. First compile with a color box can take ~10s.</span>');
  }catch(e){ say('<span style="color:var(--red)">Couldn’t open the compiler: '+esc(e.message||String(e))+'. Use “Copy .tex” → Overleaf instead.</span>'); }
}

function packetParts(co,dd,day,matCard){
  const picks=(dd.packet&&dd.packet.picks)||{};

  const src=(matCard&&matCard.querySelector('#matout'))||document;
  const parts=[]; comps.forEach(c=>{const n=src.querySelector('#'+c.domId);if(n)parts.push({comp:c,node:n});});

function printPacket(co,dd,day,matCard){
  const parts=packetParts(co,dd,day,matCard);
  if(!parts.length){toast('Check at least one printable item, then generate it');return;}
  const twoUp=dd.packet&&dd.packet.notes2up!==false;
  const di=(cur.weekKey?schoolWeeks().find(w=>w.key===cur.weekKey):null);
  const dateStr=fmt(pdate((di&&di.days.find(x=>x.day===day)?.iso)||S.calendar.firstDay));
  let skippedCustom=false;
  printNodes(parts.map(p=>{
    if(p.comp.key==='worksheet'&&dd.customWorksheet){skippedCustom=true;return null;}
    let node=p.node, twoUpThis=twoUp&&p.comp.key==='notes';
    if(p.comp.key==='notes'&&dd.guidedNotes){
      node=el(guidedNotesHtml(co,dd.guidedNotes,{key:false,dateStr,ck12:dd.ck12||dd.fallbackKhan}));
      mathRender(node); // KaTeX BEFORE measuring & printing — printNodes' iframe has no KaTeX JS

      if(twoUpThis) try{
        const meas=document.createElement("div");
        meas.style.cssText="position:fixed;left:-9999px;top:0;width:4.55in;background:#fff";
        meas.appendChild(node.cloneNode(true)); document.body.appendChild(meas);
        const hIn=meas.getBoundingClientRect().height/96; meas.remove();

        if(hIn>budget){
          const f=Math.max(0.55,budget/hIn);
          const wrap=el('<div style="transform:scale('+f.toFixed(3)+');transform-origin:top left;width:'+(100/f).toFixed(1)+'%"></div>');

        }
      }catch(e){}
    }
    return {node,twoUp:twoUpThis,label:co.name+' · '+day+' · '+p.comp.label};
  }).filter(Boolean), co.name+' — '+day+' packet');

}
function packetPDF(co,dd,day,matCard){
  const parts=packetParts(co,dd,day,matCard);

function diagramHtml(d){
  if(!d||!(d.plots||[]).length&&!(d.points||[]).length) return "";
  try{
    const p0=(d.plots||[])[0]||{}, p1=(d.plots||[])[1];
    const spec={kind:"curve",expr:p0.expr||"",domain:[d.xmin!=null?d.xmin:(p0.domain&&p0.domain[0]),d.xmax!=null?d.xmax:(p0.domain&&p0.domain[1])]};
    if(d.ymin!=null&&d.ymax!=null) spec.yrange=[d.ymin,d.ymax];
    if(p1&&p1.expr) spec.expr2=p1.expr;
    spec.marks=(d.points||[]).map(pt=>({x:+pt[0],y:+pt[1],label:String(pt[2]||"")})).filter(m=>isFinite(m.x)&&isFinite(m.y));
    const svg=plotSvg(spec); if(!svg) return "";
    return '<div class="ws-fig">'+svg+(d.caption?'<div class="ws-figcap">'+esc(d.caption)+'</div>':"")+'</div>';
  }catch(e){ return ""; }
}

  str=str.replace(/\{\{((?:[^{}]|\{[^{}]*\})*?)(?:\|([^{}|]*))?\}\}/g,function(m,ans,w){var j=blanks.length;var di=ctr.n++;
    blanks.push('<span class="rvw" data-i="'+di+'"><span class="rvw-b" style="min-width:'+esc(((w||"2cm").trim()))+'"></span><span class="rvw-w">'+esc(ans||"")+'</span></span>');
    return String.fromCharCode(1)+j+String.fromCharCode(1);});
  str=str.replace(/\$[^$]*\$/g,function(x){math.push(x);return String.fromCharCode(2)+(math.length-1)+String.fromCharCode(2);});
  str=esc(str).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  str=str.replace(new RegExp(String.fromCharCode(2)+"(\\d+)"+String.fromCharCode(2),"g"),function(_,i){return esc(math[+i]);});
  str=str.replace(new RegExp(String.fromCharCode(1)+"(\\d+)"+String.fromCharCode(1),"g"),function(_,i){return blanks[+i];});
  return str;
}
function notesRevealSlides(co,gn){

  const figFor=w=>(w&&w.figure&&/^\s*<svg/i.test(w.figure))?w.figure:(w&&w.graph?plotSvg(w.graph):'');
  const vocab=gn.vocab||[];
  for(let i=0;i<vocab.length;i+=4){
    const ctr={n:0};const chunk=vocab.slice(i,i+4);
    const html='<div class="rv-list">'+chunk.map(v=>'<div class="rv-item"><b>'+esc(v.term||"")+'</b> — '+gnRevealLine(v.def||v.definition||"",ctr)+'</div>').join("")+'</div>';
    out.push({title:(vocab.length>4?'Vocabulary ('+(Math.floor(i/4)+1)+')':'Vocabulary'),bank:i===0?bank:'',html:html,blanks:ctr.n});

function showSlideshow(pres,co,gn){

  const deck=base.map(s=>({kind:'slide',s:s})).concat(notes.map(ns=>({kind:'notes',ns:ns})));
  if(!deck.length)return; let i=0, rp=0; const total=deck.length;
  const ov=el(`<div class="deckshow" id="slideshow">

    <div class="deckstage" id="dstage"></div>
    <div class="deckfoot"><span class="dtitle">${esc((co&&co.name)||"")}${pres.title?" · "+esc(pres.title):""}</span>

  const updHint=()=>{const h=$("#shint",ov);if(!h)return;const it=deck[i]||{};h.textContent=(it.kind==='notes'&&it.ns.blanks)?'Space reveals the next word · ↵ reveals the whole slide':'Space / → next';};

function dayGradingKey(m){
  const ws=m.worksheet||{}; const probs=[];
  (ws.sections||[]).forEach(s=>(s.problems||[]).forEach(p=>probs.push(String(p).replace(/^\s*🌶\s*/,""))));
  (ws.optionalExtra||[]).forEach(p=>probs.push(String(p).replace(/^\s*🌶\s*/,"")));
  const ans=[]; (m.answerKey||[]).forEach(k=>(k.answers||[]).forEach(a=>ans.push(a)));
  return probs.map((p,i)=>({n:i+1,problem:p,answer:ans[i]!=null?String(ans[i]):""}));
}

async function verifyVideoUrl(url){
  if(!/youtube\.com\/watch|youtu\.be\//i.test(String(url||""))) return {ok:false,search:true};
  try{ const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch("https://noembed.com/embed?url="+encodeURIComponent(url),{signal:ctl.signal});
    clearTimeout(to); if(!r.ok) return {offline:true};              // 429/5xx = inconclusive, never destructive
    const j=await r.json(); if(j&&j.title&&!j.error) return {ok:true,title:j.title};
    if(j&&j.error) return {ok:false,dead:true};                     // noembed asserts the link is bad
    return {offline:true};
  }catch(e){ return {offline:true}; }
}

  }

  toast(offline?"Verifier unreachable for some links — nothing was changed for those":("Videos: "+good+" verified ✓"+(fixed?", "+fixed+" dead link"+(fixed>1?"s":"")+" swapped to search":"")));
}

  dd.attachments.push({title:(s.topic||"Sample")+" — "+(s.source||"sample"),kind:"text",body:sampleToText(s)});
  if(!dd.packet)dd.packet={picks:packetDefault(dd),audience:'core'}; dd.packet.picks.attachments=true;
  save();toast("Attached to "+cur.day);
}

function aiBox(scope,title,chips,handler){
  const box=el(`<div class="card no-print"><div class="aibox"><b>✦ Ask AI to change this ${scope}</b>
    <div class="chips">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>
    <textarea id="aitxt" rows="2" placeholder="Describe what to change…"></textarea>
    <div class="btnbar" style="margin-top:8px"><button class="btn sm" id="aigo">Regenerate</button><span id="aist" class="sub" style="margin:0"></span></div></div></div>`);
  box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{box.querySelector("#aitxt").value=c.textContent;});
  box.querySelector("#aigo").onclick=async()=>{const t=box.querySelector("#aitxt").value.trim();if(!t){toast("Type a change first");return;}await handler(t,box.querySelector("#aist"));};
  return box;
}

/* ============================================================ BOOT ===== */
/* one-time seed: make sure Pre-Calculus and Algebra II exist as classes (idempotent; won't duplicate or re-add after delete) */
function seedCourses(){
  if(S._loadFailed) return "";               // don't seed default courses on top of data we couldn't parse
  let created=0;
  const find=(name,teks)=>S.courses.find(x=>x.teks===teks||_norm(x.name)===_norm(name))||null;
  // one-time course creation (respects later deletes)
  if(!S._seeded){
    const add=(name,teks,periods,roster)=>{ if(!find(name,teks)){ S.courses.push({id:uid(),name:name,grade:"",classMinutes:45,periods:periods,roster:roster,teks:teks,assignMode:"ck12",notes:""}); created++; } };
    add("Pre-Calculus","Precalculus",1,28);
    add("Algebra II","Algebra II",1,30);
    S._seeded=1;
  }
  // one-time: Week 1 stays the CORE VALUES soft-start (generate it); the prebaked CONTENT week lives in Week 2
  let landed="";
  if(!S._prebaked5 && window.PREBAKED && (window.PREBAKED.precal||window.PREBAKED.alg2)){
    try{
      const wks=(typeof schoolWeeks==="function")?schoolWeeks():[];
      const wk1=wks[0]&&wks[0].key, wk2=wks[1]&&wks[1].key;
      const pc=find("Pre-Calculus","Precalculus"), a2=find("Algebra II","Algebra II");
      // migrate: clear the earlier seed's content week out of Week 1 (only if it IS that seeded content)
      const clr=(co,probe)=>{ if(!co||!wk1)return; const p=S.plans[co.id]&&S.plans[co.id][wk1];
        if(p&&p.days&&p.days.Mon&&String(p.days.Mon.objective||"").toLowerCase().includes(probe)) delete S.plans[co.id][wk1]; };
      clr(pc,"parent functions"); clr(a2,"vertex");
      const put=(co,wkData)=>{ if(!co||!wkData||!wkData.days||!wk2)return; S.plans[co.id]=S.plans[co.id]||{};
        if(!S.plans[co.id][wk2]) S.plans[co.id][wk2]={teks:wkData.teks||[],sped:wkData.sped||"",ell:wkData.ell||"",days:JSON.parse(JSON.stringify(wkData.days))}; };
      put(pc,window.PREBAKED.precal); put(a2,window.PREBAKED.alg2);
      if(pc&&wk1){ cur.courseId=pc.id; cur.weekKey=wk1; landed="week"; }
      S._prebaked5=1;
    }catch(e){}
  }
  if(!S._prebaked6 && window.PREBAKED && window.PREBAKED.precal3){
    try{
      const wks=(typeof schoolWeeks==="function")?schoolWeeks():[];
      const wk3=wks[2]&&wks[2].key;
      const pc=find("Pre-Calculus","Precalculus");
      if(pc&&wk3&&!(S.plans[pc.id]&&S.plans[pc.id][wk3])){
        S.plans[pc.id]=S.plans[pc.id]||{};
        const w=window.PREBAKED.precal3;
        S.plans[pc.id][wk3]={teks:w.teks||[],sped:w.sped||"",ell:w.ell||"",days:JSON.parse(JSON.stringify(w.days))};
      }
      S._prebaked6=1;
    }catch(e){}
  }
  save(); return landed||(created?"courses":"");
}
function autoLockPastDays(){
  let locked=0; const today=iso(new Date()); let wk;
  try{wk=schoolWeeks();}catch(e){return 0;}
  for(const co of S.courses){ const plans=S.plans[co.id]||{};
    for(const w of wk){ const p=plans[w.key]; if(!p||!p.days) continue;
      for(const d of (w.days||[])){ const dd=p.days[d.day];
        if(dd&&dd.objective&&dd.objective!=="No School for Students"&&d.iso<today&&!dd.locked&&!dd.autoLocked){ dd.locked=true; dd.autoLocked=true; locked++; } } } }
  if(locked) save(); return locked;
}
/* seed the LOCKED soft-start Week 1 for each class (once per course; new courses get it on next load) */
function seedWeek1(){
  if(!window.WEEK1) return 0;
  let wks; try{wks=schoolWeeks();}catch(e){return 0;} const wk1=wks[0]&&wks[0].key; if(!wk1) return 0;
  const subjOf=co=>{ const n=((co.name||"")+" "+(co.teks||"")).toLowerCase();
    if(/history|geograph|govern|econom|psycholog|sociolog/.test(n)) return "history";
    if(/english|reading|\bela\b|literat|writing/.test(n)) return "english";
    if(typeof courseIsSci==="function"&&courseIsSci(co)) return "science";
    if(typeof courseIsMath==="function"&&courseIsMath(co)) return "math";
    if(typeof courseIsEng==="function"&&courseIsEng(co)) return "english";
    return "generic"; };
  let seeded=0;
  for(const co of S.courses){ if(co._week1seeded) continue;
    S.plans[co.id]=S.plans[co.id]||{};
    if(!S.plans[co.id][wk1]){ const days=window.WEEK1(co.name||"this class", subjOf(co));
      S.plans[co.id][wk1]={teks:[],sped:"",ell:"",days:days}; seeded++; }
    co._week1seeded=true;
  }
  if(seeded) save(); return seeded;
}
/* ============================================== GUIDED TOUR (new teacher) ===
   Goal: a brand-new teacher gets to a PRINTED lesson in ~2 minutes, before any AI,
   without ever seeing the words "API key". Re-openable any time from "?  Show me around". */
const TOUR=[
 {tab:"home", sel:null, title:"Welcome — let's get you a printed lesson",
  body:"Two minutes, start to finish. <b>No sign-up, no credit card, nothing to install.</b> Your first week of lessons is already written and waiting."},
 {tab:"home", sel:["#view .card"], title:"Your classes live here",
  body:"This is the one place you pick a class. Tap a class card to open its week — everything for that class lives under it."},
 {tab:"day", sel:[".dsec","#view .card"], title:"Day 1 is already built",
  body:"Bell work, slides, guided notes, worksheet, and an exit ticket — already written for you. Each section opens and closes so you can scan the whole period fast."},
 {tab:"day", sel:["#printPacket","[id*='print']"], title:"Print it — that's a real class period",
  body:"This prints the student packet. Nothing else is required to teach tomorrow. <b>That's the whole first win.</b>"},
 {tab:"day", sel:[".aibox"], title:"Change anything in plain English",
  body:"Type things like <i>“make this easier”</i>, <i>“add a real-world problem”</i>, or <i>“we ran out of time — recap first”</i>, and the day rewrites itself around you."},
 {tab:"home", sel:null, title:"Making more — still free",
  body:"When you build a new week, the app hands you a block of text to paste into your own <b>free claude.ai</b>, then paste the answer back. No API key, no billing. (If you'd rather it be automatic, there's an optional setting — you don't need it.)"}
];
let _tourI=-1;
function tourEnd(save_){ ["tourveil","tourring","tourcard"].forEach(id=>{const n=document.getElementById(id); if(n)n.remove();}); _tourI=-1;
  if(save_){ S._tourDone=1; try{save();}catch(e){} } }
function tourShow(i){
  if(i<0||i>=TOUR.length){ tourEnd(true); toast("You're set — everything else you can just click."); return; }
  _tourI=i; const st=TOUR[i];
  // a brand-new teacher has nothing selected — aim the tour at a real class/week/day that HAS materials,
  // otherwise the Day steps land on an empty screen and the highlights find nothing.
  if(st.tab==="day"){
    try{
      const co=S.courses.find(c=>!c._example)||S.courses[0];
      if(co){ cur.courseId=co.id;
        const plans=S.plans[co.id]||{};
        let pick=Object.keys(plans).find(k=>{const p=plans[k];return p&&p.days&&WD.some(d=>p.days[d]&&(p.days[d].worksheet||p.days[d].guidedNotes));});
        if(!pick){ const w=schoolWeeks(); pick=(w[0]&&w[0].key)||cur.weekKey; }
        cur.weekKey=pick;
        const p=plans[pick];
        cur.day=(p&&p.days&&WD.find(d=>p.days[d]&&(p.days[d].worksheet||p.days[d].guidedNotes)))||"Mon";
      }
    }catch(e){}
    tab="day"; render();
  } else if(st.tab && tab!==st.tab){ tab=st.tab; render(); }
  let veil=document.getElementById("tourveil"), ring=document.getElementById("tourring"), card=document.getElementById("tourcard");
  if(!veil){ veil=el('<div id="tourveil"></div>'); document.body.appendChild(veil); }
  if(!ring){ ring=el('<div id="tourring"></div>'); document.body.appendChild(ring); }
  if(!card){ card=el('<div id="tourcard"></div>'); document.body.appendChild(card); }
  // content FIRST so the card's real height is known before we place it
  card.innerHTML=`<div class="tstep">Step ${i+1} of ${TOUR.length}</div><h4>${st.title}</h4><p>${st.body}</p>
    <div class="trow">${i>0?'<button class="btn ghost sm" id="tprev">Back</button>':''}
    <span class="sp"></span><button class="btn ghost sm" id="tskip">Skip</button>
    <button class="btn sm" id="tnext">${i===TOUR.length-1?"Done":"Next"}</button></div>`;
  // find a target (first selector that actually exists) — otherwise center the card
  let t=null; (st.sel||[]).some(s=>{ const n=document.querySelector(s); if(n){t=n;return true;} return false; });
  const VW=window.innerWidth||document.documentElement.clientWidth||1024;
  const VH=window.innerHeight||document.documentElement.clientHeight||768;
  if(t){ try{t.scrollIntoView({block:"center",behavior:"instant"});}catch(e){t.scrollIntoView(true);}   // MUST be sync — a smooth scroll measures the pre-scroll position and puts the card off-screen
    const r=t.getBoundingClientRect(), pad=6;
    ring.style.display="block";
    ring.style.left=(r.left-pad)+"px"; ring.style.top=(r.top-pad)+"px";
    ring.style.width=(r.width+pad*2)+"px"; ring.style.height=(r.height+pad*2)+"px";
    veil.style.clipPath=`polygon(0 0,100% 0,100% 100%,0 100%,0 ${r.top-pad}px,${r.left-pad}px ${r.top-pad}px,${r.left-pad}px ${r.bottom+pad}px,${r.right+pad}px ${r.bottom+pad}px,${r.right+pad}px ${r.top-pad}px,0 ${r.top-pad}px)`;
    card.style.transform="none";
    const cw=card.offsetWidth||340, ch=card.offsetHeight||200;
    const wantTop=(VH-r.bottom>ch+24)? r.bottom+14 : (r.top-ch-14);       // below if it fits, else above
    card.style.left=Math.max(12,Math.min(VW-cw-12,r.left))+"px";
    card.style.top =Math.max(12,Math.min(VH-ch-12,wantTop))+"px";          // clamped — can never sit off-screen
  } else { ring.style.display="none"; veil.style.clipPath="none";
    card.style.left="50%"; card.style.top="50%"; card.style.transform="translate(-50%,-50%)"; }
  const q=id=>card.querySelector(id);
  if(q("#tprev")) q("#tprev").onclick=()=>tourShow(i-1);
  q("#tskip").onclick=()=>tourEnd(true);
  q("#tnext").onclick=()=>tourShow(i+1);
}
function startTour(){ tourEnd(false); tourShow(0); }
window.addEventListener("resize",()=>{ if(_tourI>=0) tourShow(_tourI); });

window.addEventListener("DOMContentLoaded",async ()=>{ diagInstall(); applyLinkIdentity(); await maybeApplySeed(); normalizeAllDays(); const added=S._seedApplied?"":seedCourses(); if(!S._seedApplied)seedWeek1(); const al=autoLockPastDays(); tab = S.courses.length ? "home" : (!S.settings.apiKey ? "setup" : "home"); render(); if(al) setTimeout(()=>toast("🔒 Auto-locked "+al+" past day"+(al>1?"s":"")+" — history is safe from regeneration"),600); setTimeout(maybeAutoBackup,2500);
  {const hb=document.getElementById("helpBtn"); if(hb)hb.onclick=()=>startTour();}
  if(!S._tourDone && S.courses.length) setTimeout(startTour,900); });
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Planner</title>
<!-- bundled locally so math + PDF export work on locked-down school networks / offline (no CDN dependency) -->
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/contrib/auto-render.min.js"></script>
<script defer src="vendor/html2canvas.min.js"></script>
<script defer src="vendor/jspdf.umd.min.js"></script>
<script src="teks-data.js"></script>
<script src="courses-data.js"></script>
<script src="resources-data.js"></script>
<script src="ck12-data.js"></script>
<script src="sample-weeks.js"></script>
<script src="pacing-data.js"></script>
<script src="prebaked-weeks.js"></script>
<script src="week1-data.js"></script>
<script src="examples-data.js"></script>
<script src="ata-precal.js"></script>
<script src="deck-plot.js"></script>
<style>
:root{
  --bg:#EBEEF6; --panel:#ffffff; --ink:#0E1330; --muted:#5A6382; --line:#E4E9F5;
  --clay:#383CC1; --clay-d:#2B2FA3; --clay-soft:#EAEBFB; --gold:#E7B449;
  --green:#0B6E4F; --blue:#3A5FA5; --red:#AF1235;
  --shadow:0 1px 2px rgba(14,19,48,.05),0 8px 24px rgba(14,19,48,.07);
  --radius:14px; --radius-sm:9px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--clay-d)}
h1,h2,h3,h4{margin:.2em 0 .4em;font-weight:650;letter-spacing:-.01em}
.card h2,.tguide h2{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.015em}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}
label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin:10px 0 4px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:160px}

/* top bar */
header.app{position:sticky;top:0;z-index:50;background:rgba(245,244,239,.85);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.app-in{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:17px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(145deg,var(--clay),var(--gold));box-shadow:var(--shadow)}
nav.tabs{display:flex;gap:2px;margin-left:6px;flex-wrap:wrap}
nav.tabs button{border:none;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 13px;border-radius:99px}
nav.tabs button:hover{color:var(--ink);background:rgba(204,120,92,.08)}
nav.tabs button.active{color:var(--clay-d);background:var(--clay-soft)}
nav.tabs .tabmore{position:relative;display:inline-block}
nav.tabs .tabmore>summary{list-style:none;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;padding:8px 13px;border-radius:99px}
nav.tabs .tabmore>summary::-webkit-details-marker{display:none}
nav.tabs .tabmore>summary:hover{color:var(--ink);background:rgba(204,120,92,.08)}
nav.tabs .tabmore>summary.active{color:var(--clay-d);background:var(--clay-soft)}
nav.tabs .tabmore-box{position:absolute;top:calc(100% + 4px);left:0;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:160px;display:flex;flex-direction:column;gap:2px}
nav.tabs .tabmore-item{border:none;background:none;text-align:left;color:var(--muted);font-weight:600;font-size:13.5px;padding:8px 12px;border-radius:8px;cursor:pointer;width:100%}
nav.tabs .tabmore-item:hover{background:var(--clay-soft);color:var(--ink)}
nav.tabs .tabmore-item.on{color:var(--clay-d);font-weight:700;background:var(--clay-soft)}
.ctx{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
@media(max-width:640px){
  .app-in{flex-wrap:wrap;padding:9px 13px;gap:6px 10px}
  .brand{font-size:16px}
  .ctx{font-size:12px}
  .ctx #ctxname{max-width:44vw!important}
  nav.tabs{order:3;width:100%;margin-left:0;gap:2px}
  nav.tabs button,nav.tabs .tabmore>summary{font-size:13px;padding:7px 11px}
  main{padding:16px 12px 72px}
  .card{padding:15px 14px;margin-bottom:14px}
  .card h2{font-size:18px}
}

main{max-width:1180px;margin:0 auto;padding:26px 22px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.card h2{font-size:19px}
.sub{color:var(--muted);font-size:13.5px;margin:-2px 0 14px}
.grid{display:grid;gap:16px}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1fr 1fr 1fr}}

.btn{background:var(--clay);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 16px;font-weight:650;font-size:14px;box-shadow:var(--shadow)}
.btn:hover{background:var(--clay-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--clay);color:var(--clay-d)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btnbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--clay-soft);color:var(--clay-d)}
.pill.green{background:#e2efe8;color:var(--green)} .pill.blue{background:#e3edf6;color:var(--blue)}
.pill.red{background:#f6e3e0;color:var(--red)} .pill.gray{background:#eceae4;color:var(--muted)}
.pill.gold{background:#f7ecd2;color:#9a6f15}

.empty{color:var(--muted);text-align:center;padding:30px;border:1.5px dashed var(--line);border-radius:var(--radius)}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;margin-bottom:10px}
.item:hover{border-color:var(--clay)}
.item .grow{flex:1}
.item .t{font-weight:650}
.item .m{font-size:12.5px;color:var(--muted)}

/* calendar mini */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:2px}
.cal .d{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;font-size:12px;padding:4px;background:#fff;position:relative;overflow:hidden}
.cal .d.off{background:#EEF0FA;color:var(--muted)}
.cal .d.holiday{background:#f6e3e0}.cal .d.break{background:#efe7da}.cal .d.early{background:#f7ecd2}
.cal .d.test{outline:2px solid var(--blue);outline-offset:-2px}
.cal .d .lab{font-size:8.5px;line-height:1.1;color:var(--muted);display:block;margin-top:2px}
.cal .mlabel{grid-column:1/-1;font-weight:700;margin:8px 0 2px}

/* week grid */
.weekgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.day{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;min-height:120px}
.day h4{margin:0 0 2px;font-size:13.5px}
.day .date{font-size:11.5px;color:var(--muted)}
.day .obj{font-size:13px;margin:8px 0}
.day.off{background:#EEF0FA}
.day .mini{font-size:12px;color:var(--muted);margin-top:auto}

/* EPISD lesson plan table (print-faithful) */
.lp{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff}
.lp td,.lp th{border:1px solid #333;padding:5px 6px;vertical-align:top}
.lp .hdr td{background:#EEF0FA;font-weight:700}
.lp .sec{background:#eceae4;font-weight:700;font-size:11px}
.lp .dcol{width:20%}
.lp .prompt{font-weight:400;color:#555;font-size:10px}

/* doc (notes / worksheet) */
.doc{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:26px 30px;line-height:1.6}
.doc h2{font-size:18px}.doc h3{font-size:15px;margin-top:16px}.doc h4{font-size:13.5px;margin-top:12px}
.doc .wstack{margin:14px 0}
.worked{background:#f7f4ee;border-left:3px solid var(--clay);border-radius:6px;padding:10px 14px;margin:10px 0}
.worked .tag{font-size:11px;font-weight:700;color:var(--clay-d);text-transform:uppercase;letter-spacing:.04em}
.prob{margin:10px 0;padding-bottom:6px}
.prob .q{font-weight:600}
.workspace{border:1px dashed #bbb;border-radius:6px;height:70px;margin-top:6px;background:repeating-linear-gradient(transparent,transparent 22px,#eee 22px,#eee 23px)}
.vidblock{border-left:3px solid var(--blue)}
.vidblock a{font-weight:600;color:var(--blue)}
table.vocab{border-collapse:collapse;width:100%;font-size:13px}
table.vocab td,table.vocab th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.vocab th{background:#EEF0FA}
table.vocab tr.diff td{background:#f6e3e0}
.gridbox{height:150px;border:1px solid #ccc;border-radius:6px;margin:8px 0;background-image:linear-gradient(#e8e8e8 1px,transparent 1px),linear-gradient(90deg,#e8e8e8 1px,transparent 1px);background-size:18px 18px}
.drawbox{height:140px;border:1px dashed #bbb;border-radius:6px;margin:8px 0;background:#fcfbf8}
.figsvg{margin:8px 0;text-align:center}
.figsvg svg{max-width:100%;height:auto}
.figcap{font-size:12.5px;color:var(--muted);margin:8px 0 2px}
.prob .qn{display:inline-block;min-width:30px;font-weight:700;color:var(--clay-d)}
.ansline{margin-top:6px;font-size:13px;color:var(--muted)}
.ansbox{display:inline-block;width:130px;height:22px;border:1px solid #888;border-radius:4px;vertical-align:middle;margin-left:6px;background:#fff}
.wstack.optional{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.wstack.optional h4{color:var(--muted)}
.editmode .editsec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:#F7F8FD}
.choices{margin:6px 0 0 18px;font-size:13.5px;line-height:1.7}
.bubbles{font-size:13px}
.brow{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid #f0ede6}
.brow .bn{width:26px;text-align:right;font-weight:700;color:var(--muted)}
.brow .bub{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1.5px solid #888;border-radius:50%;font-size:11px;color:#555}
.testsched{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;margin-bottom:8px}
.testsched.due{border-color:var(--gold);background:#fdf7ea}
.hookbox{border-left:3px solid var(--gold);background:#FBF6E8;padding:10px 14px}
.slidecard{margin:8px 0}
.slidecard h4{margin:2px 0 6px;font-size:15px}
ol.steps{margin:6px 0 6px 4px}
ol.steps li{margin:3px 0}
.slideshow .slidewrap{width:min(1040px,94vw);height:min(620px,86vh);background:#fff;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.22)}
.slideshow .sbar{height:3px;background:var(--line);flex:none}
.slideshow .sbar .sfill{height:100%;background:var(--clay);transition:width .2s}
.slideshow .slide{flex:1;padding:48px 56px;overflow:auto}
.slideshow .slide h1{font-size:40px;font-weight:600;margin:0 0 24px;letter-spacing:-.02em;line-height:1.1}
.slideshow .slide ul{font-size:22px;line-height:1.8;margin:0 0 0 4px}
.slideshow .slide li{margin:10px 0}
.slideshow .slideex{margin-top:24px;border-top:1px solid var(--line);padding:18px 0 0;font-size:20px}
.slideshow .slideex .ws-ex-lab{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:0;margin-bottom:6px}
.slideshow .slidememe{margin-top:22px;font-size:16px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.slideshow .sfoot{display:flex;justify-content:space-between;align-items:center;padding:9px 24px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);flex:none}
.slideshow .slidenav{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);flex:none}
.docmeta{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:14px;font-size:13px}

/* ---- worksheet in Robert's real style ---- */
.wsheet{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:30px 34px;color:#1b1a18}
.wsheet .ws-title{text-align:center;font-size:20px;font-weight:750;letter-spacing:-.01em;margin:0}
.wsheet .ws-name{display:flex;justify-content:space-between;gap:18px;font-size:12.5px;color:#555;border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin:10px 0 16px}
.wsheet .ws-instr{font-style:italic;color:#444;margin:0 0 16px}
.ws-sec{margin:20px 0}
.ws-sec-h{font-size:14px;font-weight:750;color:var(--ink);display:flex;align-items:center;gap:9px;margin:0 0 10px}
.ws-sec-h .ws-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--clay);border-radius:5px;padding:3px 8px;flex:none}
.ws-ex{background:#F4F5FC;border:1px solid #D9DDF3;border-left:4px solid var(--clay);border-radius:9px;padding:12px 16px;margin:0 0 12px}
.ws-ex .ws-ex-lab{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--clay-d);margin-bottom:5px}
.ws-divider{border:none;border-top:1.5px solid var(--ink);margin:4px 0 12px}
.ws-directions{font-weight:750;margin:0 0 12px;font-size:13.5px}
.ws-cols{column-count:2;column-gap:30px}
@media(max-width:620px){.ws-cols{column-count:1}}
.ws-q{break-inside:avoid;margin:0 0 6px;padding-bottom:8px}
.ws-q .ws-num{font-weight:800;color:var(--clay-d);margin-right:7px}
.ws-q .ws-body{font-weight:500}
.ws-q.chili .ws-num::after{content:" 🌶";font-size:11px}
.ws-work{height:62px;border-bottom:1px solid #ddd6c9;margin-top:6px;background:repeating-linear-gradient(transparent,transparent 19px,#f0ece2 19px,#f0ece2 20px)}
.ws-work.ws-work-s{height:40px}
.ws-work.ws-work-l{height:104px}
.ws-ansline{margin-top:7px;font-size:12.5px;color:#666}
.ws-ansline .ws-box{display:inline-block;width:110px;border-bottom:1.5px solid #888;margin-left:6px;vertical-align:middle}
/* corner answer grid ("scantron") — final answers in one box for fast grading */
.ws-scantron{border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px;margin:0 0 16px;background:#fcfbf8}
.ws-scantron-t{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:7px}
.ws-scantron-grid{display:flex;flex-wrap:wrap;gap:7px 16px}
.ws-cell{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;min-width:84px}
.ws-cell b{color:var(--clay-d)}
.ws-cell .ws-blank{display:inline-block;flex:1;min-width:44px;border-bottom:1px solid #888;height:15px}
.ws-cell.mc{gap:3px}.ws-cell .bub{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border:1.3px solid #888;border-radius:50%;font-size:10px;color:#555}
.ws-challenge{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.ws-challenge .ws-sec-h .ws-tag{background:var(--gold);color:#5a3d05}

.ws-fig{max-width:3in;margin:6px auto 10px;border:1px solid var(--line);border-radius:9px;padding:4px;background:#fff}
.ws-fig svg{display:block;width:100%;height:auto}
.ws-figcap{font-size:11px;color:var(--muted);text-align:center;margin-top:3px;font-family:ui-monospace,Consolas,monospace}
/* ---- slide cards + presentation — flat Claude-design aesthetic (one restrained accent, no gradients) ---- */
.slidecard{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0;background:#fff;box-shadow:none}
.slidecard.k-example{border-left:3px solid var(--clay)}
.slidecard .sc-bar{display:none}
.slidecard .sc-body{padding:18px 22px}
.slidecard .sc-num{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0}
.slidecard h4{font-size:19px;font-weight:600;margin:5px 0 10px;letter-spacing:-.01em;color:var(--ink)}
.slidecard ul{margin:6px 0 0 18px}
.slidecard li{margin:6px 0;font-size:15px;line-height:1.55}
.sc-ex{margin-top:14px;border-top:1px solid var(--line);padding:14px 0 0;font-size:14.5px}
.sc-ex .ws-ex-lab{font-size:11px;font-weight:600;letter-spacing:0;color:var(--muted);margin-bottom:5px}
.sc-meme{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.sc-meme b{color:var(--ink);font-weight:600}
.sc-meme a{font-weight:600}

/* ---- teacher daily guide ---- */
.tguide{background:linear-gradient(180deg,#FDFDFF,#F3F5FC);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px;margin-bottom:18px}
.tguide h2{font-size:18px;margin:0 0 2px}
.tguide .tg-sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.tg-flow{list-style:none;margin:0;padding:0}
.tg-flow li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #E9EDF8;align-items:flex-start}
.tg-flow li:last-child{border-bottom:none}
.tg-time{flex:none;width:54px;font-weight:700;color:var(--clay-d);font-size:12.5px;padding-top:1px}
.tg-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tg-chip{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--ink)}
.tg-chip b{color:var(--clay-d)}
.tg-lock{margin-top:12px}
.tg-step{flex:1}
.tg-step-t{font-weight:700;font-size:13.5px}
.tg-do{font-size:13px;margin-top:2px}
.tg-say{font-size:12.5px;color:var(--green);margin-top:4px}
.tg-opts{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.tg-opts .ol{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tg-opt{font-size:12px;background:#EEF0FA;border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:#4a463d}
.tg-opt b{color:var(--clay-d)}

/* ---- tidier day toolbar (More ▾ disclosure) ---- */
.toolmore[open] .toolmore-sum{color:var(--clay-d)}
.toolmore-sum{cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--muted);padding:7px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;display:inline-block}
.toolmore-sum::-webkit-details-marker{display:none}
.toolmore-sum:hover{border-color:var(--clay);color:var(--clay-d)}
.toolmore .toolmore-body{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#F7F8FD}

/* AI box */
.aibox{border:1px solid var(--line);background:#F6F7FD;border-radius:var(--radius-sm);padding:14px;margin-top:14px}
.aibox .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px}
.chip:hover{border-color:var(--clay);color:var(--clay-d)}
/* day-menu pick chips */
.pchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;margin:3px 5px 3px 0;cursor:pointer;vertical-align:middle;transition:background .12s,border-color .12s}
.pchip:hover{border-color:var(--clay)}
.pchip.on{background:var(--clay-soft);border-color:var(--clay);color:var(--clay-d)}
.pchip input{width:auto;margin:0;accent-color:var(--clay)}
.pchip .psum{font-size:11px;font-weight:500;color:var(--muted)}
.pchip.on .psum{color:var(--clay-d)}
.pchip.teacher{border-style:dashed;opacity:.9}

/* Starter HS math TEKS — strand level. VERIFY codes at teks.texasgateway.org before official use. */
let TEKS = {

/* Suggested unit pacing by course (research-grounded; district-representative estimates, not EPISD-authoritative). */
let PACING = {
  "Algebra I":{weeksGuide:"Finish tested TEKS before the late-April STAAR EOC (~wk 32-34); reserve 2-4 wks EOC review in 6wk#5.",units:[
    ["Solving Linear Equations & Inequalities",3],["Graphing & Writing Linear Functions",6],["Systems of Linear Equations & Inequalities",6],
    ["Operations of Polynomial Functions",4],["Graphs of Quadratic Functions",3],["Solving Quadratic Equations",3],

  "Algebra II":{weeksGuide:"~33 wks, even pacing, no EOC.",units:[
    ["Absolute Value Functions",3],["Systems (incl. 3-variable)",4],["Quadratics & Complex Numbers",3],
    ["Quadratic & Square-Root Functions / inverses",3],["Cubic & Cube-Root / rational exponents",3],

  "Precalculus":{weeksGuide:"~33 wks; functions -> trig -> vectors/conics/series. No EOC.",units:[

    ["Periodic Functions (unit circle, radians)",3],["Graphing Sine & Cosine",3],["All Trig + Inverse Trig",3],
    ["Analytic Trig (identities, equations)",3],["Vectors, Law of Sines/Cosines",3],["Conics, Parametric, Polar, Sequences & Series",4]]},
  "College Algebra (dual credit)":{weeksGuide:"ACGM MATH 1314 (~16 college wks — roughly double if stretched over the full HS year). Exams ~wk5/10/14, final wk16. No EOC.",units:[

};

/* Override TEKS/PACING with the full scraped dataset when available (teks-data.js -> window.TEKS_FULL). Falls back to the hardcoded set above if the data file didn't load. */
(function(){
  const courses=(window.TEKS_FULL&&window.TEKS_FULL.courses)||[];
  if(!courses.length) return;
  const collegeAlg=TEKS["College Algebra (dual credit)"], collegePacing=PACING["College Algebra (dual credit)"];
  TEKS={}; PACING={};
  courses.forEach(c=>{
    TEKS[c.course]={staar:!!c.hasStaarEOC,strands:(c.strands||[]).map(s=>[s.code,s.statement]),full:c};
    if(c.sequence&&c.sequence.length) PACING[c.course]={weeksGuide:(c.hasStaarEOC?"Finish tested TEKS before the late-April STAAR EOC; reserve 2-4 wks review.":"District-representative full-year sequence."),units:c.sequence.map(u=>[u.unit,u.weeks])};
  });
  if(collegeAlg)TEKS["College Algebra (dual credit)"]=collegeAlg;
  if(collegePacing)PACING["College Algebra (dual credit)"]=collegePacing;
  TEKS["Custom / other"]={staar:false,strands:[]};
  // merge Robert's real course templates (Google Classroom): elective pacing + start-weeks + flow
  const CT=window.COURSE_TEMPLATES||{};
  Object.keys(CT).forEach(name=>{ if(TEKS[name]){ TEKS[name].template=CT[name];
    if((CT[name].arc||[]).length)   // his OWN Google-Classroom sequence is authoritative for courses he teaches — overrides the generic scraped pacing
      PACING[name]={weeksGuide:"Your real course flow (from your Google Classroom).",units:CT[name].arc.map(u=>[u.unit,u.weeks]),mine:true};
  }});
  // El Paso-area calibrated YAG pacing fills in courses he DOESN'T have his own sequence for
  const PL=window.PACING_LOCAL||{};
  Object.keys(PL).forEach(name=>{ const p=PL[name]; if(!p||!(p.pacing||[]).length)return;
    if(PACING[name])return;   // a generated strand-complete year plan (sequence) or his own Google-Classroom arc already won — district YAG is fallback only
    PACING[name]={weeksGuide:"Calibrated to El Paso-area district YAGs"+(p.notes?": "+p.notes:"."),units:p.pacing.map(u=>[u.unit,u.weeks||1]),local:true};
  });
  // FALLBACK: any course still without a year map gets one auto-derived from its TEKS strands, so ANY week can be generated
  Object.keys(TEKS).forEach(name=>{
    if(PACING[name]) return;
    const st=(TEKS[name]&&TEKS[name].strands)||[];
    if(!st.length) return;
    const per=Math.max(1,Math.min(4,Math.round(36/st.length)));
    PACING[name]={weeksGuide:"Auto-mapped from this course's TEKS strands — tune unit lengths in the Year tab.",units:st.map(x=>[x[1]||x[0],per]),derived:true};

/* CK-12 lesson lookup — match a day's objective to a real CK-12 section (the default graded assignment). */
function _norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();}
function ck12LessonFor(courseName,objective){
  const list=window.CK12_PACING||[]; if(!list.length||!objective)return null;
  const c=list.find(x=>x.course===courseName)||list.find(x=>_norm(x.course)===_norm(courseName));
  if(!c)return null;
  const key=new Set(_norm(objective).split(" ").filter(w=>w.length>2));
  if(!key.size)return null;
  let best=null,bestScore=0;
  (c.chapters||[]).forEach(ch=>(ch.lessons||[]).forEach((title,i)=>{
    const toks=_norm(title).split(" ").filter(w=>w.length>2); if(!toks.length)return;
    let hit=0; toks.forEach(t=>{if(key.has(t))hit++;});
    const score=hit/Math.max(toks.length,key.size);
    if(score>bestScore){bestScore=score;best={chapter:ch.n,idx:i+1,title};}
  }));
  if(bestScore<0.34)return null;
  return {title:best.title,url:(c.flexbookUrl||"")+"section/"+best.chapter+"."+best.idx+"/"};
}
function assignModeFor(co){
  if(co.assignMode==="ck12"||co.assignMode==="khan")return co.assignMode;
  if(co.assignMode==="worksheet")return "";
  return (TEKS[co.teks]&&TEKS[co.teks].template&&TEKS[co.teks].template.ck12Main)?"ck12":"";
}
function khanLessonFor(co,objective){
  const b=(typeof resolveBank==="function")?resolveBank(co):null; const k=b&&b.khan;
  if(!k||!(k.units||[]).length)return null;
  const key=new Set(_norm(objective).split(" ").filter(w=>w.length>2)); if(!key.size)return {title:k.name,url:k.url};
  let best=null,bestScore=0;
  k.units.forEach(u=>{const toks=_norm(u.name).split(" ").filter(w=>w.length>2);let hit=0;toks.forEach(t=>{if(key.has(t))hit++;});const s=toks.length?hit/Math.max(toks.length,key.size):0;if(s>bestScore){bestScore=s;best=u;}});
  return best&&bestScore>=0.34?{title:best.name,url:best.url||k.url}:{title:k.name,url:k.url};
}
/* the full real CK-12 section list for a course — so the AI (not a weak word-matcher) picks the best section.
   returns {byNum:{"1.1":{title,url}}, text:"1.1 Function Families\n1.2 ..."} or null. */
function ck12SectionsFor(courseName){
  const listA=window.CK12_PACING||[];
  const c=listA.find(x=>x.course===courseName)||listA.find(x=>_norm(x.course)===_norm(courseName));
  if(!c||!(c.chapters||[]).length)return null;
  const byNum={}, lines=[];
  (c.chapters||[]).forEach(ch=>(ch.lessons||[]).forEach((title,i)=>{
    const num=ch.n+"."+(i+1); byNum[num]={title:title,url:(c.flexbookUrl||"")+"section/"+num+"/",section:num}; lines.push(num+" "+title);
  }));
  return {byNum:byNum, text:lines.join("\n")};
}
/* Full lettered student expectations (with STAAR tags) for generation prompts. */
function teksFullText(course){
  const f=TEKS[course]&&TEKS[course].full;
  if(!f) return ((TEKS[course]&&TEKS[course].strands)||[]).map(s=>s[0]+" "+s[1]).join("\n");
  return (f.strands||[]).map(s=>s.code+" "+s.statement+"\n"+(s.expectations||[]).map(e=>"   "+e.code+" — "+e.text+(e.staar?" ["+e.staar+"]":"")).join("\n")).join("\n");
}
function teksTextForCodes(course,codes){
  const f=TEKS[course]&&TEKS[course].full;
  if(!f||!codes||!codes.length) return (codes||[]).join(", ");
  const out=[]; (f.strands||[]).forEach(s=>(s.expectations||[]).forEach(e=>{ if(codes.some(c=>e.code.startsWith(c))) out.push(e.code+" — "+e.text+(e.staar?" ["+e.staar+"]":"")); }));
  return out.length?out.join("\n"):codes.join(", ");
}

/* Year-arc + pedagogy guidance (research-grounded) injected into the generator. */
const GEN_GUIDANCE = "Build every plan on a Texas HS frame: ~150-165 truly instructional days across six ~6-week grading periods, 45-min periods. Open the year with a SOFT START — Days 1-3 are procedures, an interactive syllabus, relationship/icebreaker activities, and a TEKS-tagged beginning-of-year diagnostic, with content low-stakes; ramp into real content by Day 4 and full rigor in Week 2, teaching only 3-4 core procedures well ('go slow at the beginning to go fast at the end'). After any long break, re-establish routines and do low-stakes retrieval review before resuming new rigor. STAAR EOC exists ONLY for Algebra I, Biology, English I/II, and US History; spring window is LATE APRIL, so finish tested TEKS by early April and reserve 2-4 wks review — non-tested courses pace evenly. Span multi-concept topics across days (intro -> explore -> apply -> assess); chunk each 45-min period into a ~5-min retrieval warm-up + 2-3 short model/guided/independent blocks + exit ticket; for MATH let students attempt before formal modeling. Give early finishers low-floor/high-ceiling ENRICHMENT (open-middle, Fermi, 3-Act, design-your-own), never speed-based extra credit.";
const YEAR_ARC = {
  week1: "FIRST WEEK OF SCHOOL — keep it LIGHT and community-focused; this week centers on the Core 4 / core values, NOT heavy academics. Each day tie an activity to the teacher's Core 4 values. Mon-Tue: door greeting + entry routine, teacher intro, low-stakes icebreaker, interactive syllabus, teach 3-4 core procedures, start a core-values poster/anchor chart. Wed: finish & present the values poster, co-create & sign class norms tied to the Core 4, add transition/group/tech procedures, a relationship activity, and a SHORT low-stakes beginning-of-year diagnostic. Thu-Fri: a confidence-building first taste of the subject connected to a value (e.g. 'Quality of Work' = always show your steps). CALIBRATE Week-1 rigor TO THE COURSE LEVEL: an on-level freshman class stays very light all week, but an ADVANCED/upper course (Pre-Calculus, Algebra II, dual-credit, AP) SHOULD do genuine prerequisite review by Wed-Thu — real content like slope, exponents, or factoring is completely appropriate Week 1; just keep it welcoming, not babyish. Don't make an upper class do trivial busywork.",
  afterBreak: "FIRST WEEK BACK FROM A BREAK — re-establish routines and norms first, open with a connection hook and a low-stakes retrieval review of prior material, then ramp rigor back over 1-2 days before new heavy content."

"(e) IN-CLASS SCOPE & COUNT — keep the worksheet finishable in the period (1-3 short sections). TARGET about 8-12 PRACTICE problems total (~10 on average), scaled to DIFFICULTY and time: fewer (~8) when problems are hard/multi-step (each takes longer), more (~12) when they are quick single-step or eval problems — this is what fits a 45-min class. Put only 1-2 leftover problems in 'optionalExtra' (the same-sheet Challenge, for anyone who finishes), ON TOP of the 8-12 — NOT a full homework. "+

"(j) DAILY MODEL (how THIS teacher plans — match it): OVERSTOCK every normal day to about 60-70 minutes of content for a 45-min class, so the teacher can PICK and choose — never under-plan. Daily rhythm: bell ringer -> go over bellwork -> intro the new topic (or CONTINUE yesterday's) -> guided notes + worked examples -> worksheet practice -> exit ticket. A short video may stand in for the bell ringer. Include guided NOTES on most content days (a pure practice/review day may skip them). COHERENCE (critical): the guided notes' worked example and You-Try, the presentation's worked example, and the worksheet must all drill the SAME problem types in the same order — the notes are the on-ramp to the worksheet, so the worksheet must never introduce a skill the notes didn't teach. "+
"(k) WORKSHEET FORMAT (his signature — match it exactly): group problems BY TYPE. For each section give: 'type' (a clear label), a fully worked 'workedExample' (step-by-step with the answer) OR a one-line 'why' explanation, an optional one-line 'directions', and the 'problems'. The worked example is INSTRUCTION (a model), the problems are the STUDENT WORK — keep them visibly distinct. Number problems continuously. Keep the whole worksheet to AT MOST ~2 sheets (one double-sided page, or two), legible, sized to fill the class. A worksheet MAY SPAN MULTIPLE DAYS — when it does, mark which problems are 'for today' vs 'next day'. "+
"(l) SLIDE QUALITY — decks must feel CRAFTED and expert, never basic or generic, and NEVER a full new deck every day. Each slide = a crisp SPECIFIC heading + 3-5 bullets, and THE BULLETS ARE THE LESSON: every bullet is a COMPLETE, concrete idea of about 8-16 words that states the actual fact, definition, step, or cause->effect relationship — NEVER a bare topic label ('Overview','Key points','Important','The cell','Definition') and NEVER a wall of text. Lead each bullet with its key term or number in **bold**, and put a real value, concrete example, or a because/so-that relationship in MOST bullets (not vague generalities). Litmus test: a colleague with zero prep could teach the class straight from these bullets. A LAUNCH deck runs hook -> big picture -> today's vocab -> worked example (with a drawn graph) -> common mistake -> group we-do -> roadmap; a BUILD deck is 3-4 slides (what's new -> one worked example -> one common mistake or you-try). At least one slide on any deck is a fully WORKED EXAMPLE specific to the exact topic (real named steps, never boilerplate), and the deck's worked example + you-try use the SAME problem types the worksheet drills. Set the presentation's 'kind' to 'launch' or 'build'. Do NOT add meme/joke/commentary slides or 'watch this video' placeholders — only reference a video when a REAL watch URL is provided. "+
"(m) TONE — all student- and observer-facing wording stays positive and professional; label early-finisher work simply 'Challenge'; never use phrases like 'go deeper' or 'go deep'. "+

"(q) ANSWER KEY (complete or it FAILS his bar): the answerKey total answers must EXACTLY equal (number of practice problems + number of optionalExtra), in order, each fully simplified with the correct restriction; never leave a challenge/optionalExtra unkeyed; never truncate an answer mid-expression. Each answer is FULLY WORKED — a brief reason or procedure, not a bare value (e.g. 'opens up => min; vertex (0,2); dec x<0, inc x>0'); the key prints as 'Answer Key — fully worked' led by the section 'procedure'. "+

"(t) DIAGRAMS (draw the graph, don't gesture at it): where a graph aids understanding (parabolas, roots, transformations, domain), give a 'diagram' object — as a worksheet section's 'diagram' and/or 'guidedNotes.diagram' — instead of a 'figure' placeholder. Shape: {plots:[{expr, domain:[a,b], color, dashed}], xmin,xmax,ymin,ymax, xtick,ytick, points:[[x,y,'label','color']], caption, width, height}. 'expr' is pgfplots syntax — use * for multiply and ^ for power: 'x^2+5*x+6', 'sqrt(x-2)', '(x-3)^2+2'. NO CLIPPED CURVES: choose 'domain' and ymin/ymax so the WHOLE plotted curve fits with headroom — figure the largest |y| the expression reaches on the domain and set ymax/ymin a bit BEYOND it (never equal). Mark key points (vertex, roots, start) in 'points'. Challenge/optionalExtra now prints on the SAME sheet as the practice, so keep it to 1-2 problems. "+
"(u) SCENARIO DISJOINTNESS (hard rule — sharing a subtype LABEL is fine, reusing the SITUATION is not): a worksheet or challenge item may share a subtype with something you modeled, but must NEVER reuse its concrete scenario, entities, key nouns, numbers, or final answer. Before emitting EACH worksheet/challenge item, scan EVERY modeling surface — the markdown 'notes' (incl. any inline You-Try answer), guidedNotes examples AND youTry, procedureExamples, the slide deck, and the mistake/Watch-Out slide — and confirm this item's scenario, key nouns, and answer appear NOWHERE above; if they collide, regenerate it with a fresh context (different object/place/numbers). NEVER pre-solve or pre-teach a 🌶 challenge or optionalExtra anywhere — and the mistake/Watch-Out slide must target a misconception that NO challenge item tests. Challenges stay UNSEEN until the worksheet. "+

/* Some day fields (agenda, exitTicket…) are meant to be arrays, but a generated/imported day
   can carry a plain string — which used to crash the whole view on .map/.join. Always coerce. */
function asList(v){
  if(Array.isArray(v)) return v.filter(x=>x!=null&&String(x).trim()!=="");
  if(v==null||v==="") return [];
  return String(v).split(/\r?\n|;|(?:\s+[••]\s*)/).map(s=>s.replace(/^\s*[••-]\s*/,"").trim()).filter(Boolean);
}
/* Generated/imported days sometimes carry a STRING where the UI expects an ARRAY (e.g. agenda,
   exitTicket, vocab). That used to crash the whole Day view / LaTeX on .map/.forEach. Coerce once,
   at the boundary (on load + after every generation), so no downstream consumer can ever hit it. */
function normalizeDay(dd){
  if(!dd||typeof dd!=="object") return dd;
  ["agenda","exitTicket"].forEach(k=>{ if(dd[k]!=null && !Array.isArray(dd[k])) dd[k]=asList(dd[k]); });      // arrays of strings
  if(dd.vocab!=null && !Array.isArray(dd.vocab)) dd.vocab=String(dd.vocab).split(/[,;\n]/).map(s=>({term:s.trim(),definition:""})).filter(x=>x.term);
  ["answerKey","procedureExamples","script"].forEach(k=>{ if(dd[k]!=null && !Array.isArray(dd[k])) dd[k]=[]; }); // arrays of OBJECTS — a string can't rebuild them
  if(dd.worksheet&&typeof dd.worksheet==="object"){ const w=dd.worksheet;
    if(!Array.isArray(w.sections)) w.sections = Array.isArray(w.sections)?w.sections:[];
    ["procedure","optionalExtra"].forEach(k=>{ if(w[k]!=null && !Array.isArray(w[k])) w[k]=asList(w[k]); });
    (w.sections||[]).forEach(s=>{ if(s&&s.problems!=null&&!Array.isArray(s.problems)) s.problems=asList(s.problems); });
  }
  if(dd.guidedNotes&&typeof dd.guidedNotes==="object"){ const g=dd.guidedNotes;
    ["examples","youTry","formulas","vocab"].forEach(k=>{ if(g[k]!=null&&!Array.isArray(g[k])) g[k]=[]; }); }
  if(dd.presentation&&typeof dd.presentation==="object"&&!Array.isArray(dd.presentation.slides)) dd.presentation.slides=[];
  if(dd.video&&dd.video.questions!=null&&!Array.isArray(dd.video.questions)) dd.video.questions=asList(dd.video.questions);
  return dd;
}

/* event lookup for a date */
function dayInfo(isoStr){
  const dt=pdate(isoStr), dow=dt.getDay();
  const cal=S.calendar;
  if(isoStr<cal.firstDay||isoStr>cal.lastDay) return {status:"out",label:"Outside school year"};
  if(dow===0||dow===6) return {status:"weekend",label:"Weekend"};
  for(const e of cal.events){
    const a=e.start, b=e.end||e.start;
    if(isoStr>=a&&isoStr<=b){
      if(e.type==="holiday"||e.type==="break") return {status:"off",label:e.label};
      if(e.type==="early") return {status:"early",label:e.label};
      if(e.type==="test") return {status:"test",label:e.label};
      if(e.type==="marker") return {status:"school",label:e.label};
    }
  }
  return {status:"school",label:""};
}

/* all Mon-anchored school weeks */
function schoolWeeks(){
  const cal=S.calendar; let first=pdate(cal.firstDay);
  const back=(first.getDay()+6)%7; let mon=addDays(first,-back);
  const last=pdate(cal.lastDay); const weeks=[];
  while(mon<=last){
    const days=WD.map((d,i)=>{const dt=addDays(mon,i);return{day:d,iso:iso(dt),dt};});
    if(days.some(d=>d.iso>=cal.firstDay&&d.iso<=cal.lastDay&&dayInfo(d.iso).status!=="off"))
      weeks.push({key:iso(mon),mon:new Date(mon),days});
    mon=addDays(mon,7);
  }
  return weeks;
}

async function callClaude({system,messages,max_tokens=4096,pdf=null,image=null}){
  const key=S.settings.apiKey&&S.settings.apiKey.trim();
  if(!key) return await bridgeAsk(system,messages,pdf);   // no key -> copy/paste via your claude.ai
  let msgs=messages;
  if(pdf){msgs=[{role:"user",content:[
    {type:"document",source:{type:"base64",media_type:"application/pdf",data:pdf}},
    {type:"text",text:messages[0].content}]}];}
  else if(image&&image.data){msgs=[{role:"user",content:[
    {type:"image",source:{type:"base64",media_type:image.mediaType||"image/png",data:image.data}},
    {type:"text",text:messages[0].content}]}];}
  let out="", stop="", passes=0;
  const CONT='Your previous message was cut off mid-output by the length limit. Continue EXACTLY where it stopped: output ONLY the remaining text, starting with the very next character. No preamble, no apology, no repetition of earlier text, no code fences.';
  const _want=S.settings.model||"claude-sonnet-4-6";
  const MODELS=[_want,"claude-sonnet-4-6","claude-opus-4-8","claude-haiku-4-5"].filter((m,i,a)=>m&&a.indexOf(m)===i);   // if the pinned model is ever retired, fall through to a working one
  async function fetchModel(sendMsgs){ let lastErr="";
    for(let mi=0;mi<MODELS.length;mi++){
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
        headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:MODELS[mi],max_tokens,system,messages:sendMsgs})});
      if(res.ok){ if(MODELS[mi]!==S.settings.model){S.settings.model=MODELS[mi];try{save();toast("Switched to an available AI model: "+MODELS[mi]);}catch(_){}} return res; }
      const t=await res.text(); lastErr="API "+res.status+": "+t.slice(0,300);
      if(!(res.status===404||/model|not_found/i.test(t))) throw new Error(lastErr);   // real error (bad key / rate limit / overload) — don't model-swap
    }
    throw new Error(lastErr+" — no available AI model; check Setup.");
  }
  while(passes<3){
    const sendMsgs = out ? msgs.concat([{role:"assistant",content:out.replace(/\s+$/,"")},{role:"user",content:CONT}]) : msgs;
    const res=await fetchModel(sendMsgs);
    const data=await res.json();
    const chunk=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
    let piece=chunk;
    if(out){ // continuation pass: strip fences/preamble whitespace, then trim any overlap with what we already have
      piece=piece.replace(/^\s*```(?:json)?\s*/,"").replace(/\s*```\s*$/,"");
      for(let k=Math.min(240,piece.length);k>=8;k--){ if(out.endsWith(piece.slice(0,k))){piece=piece.slice(k);break;} }
    }
    out+=piece;
    stop=data.stop_reason; passes++;
    if(stop!=="max_tokens") break;         // done — otherwise ask it to pick up where it stopped
  }
  if(stop==="max_tokens") throw new Error("The reply is too long even after continuing 3× — regenerate, or generate day-by-day instead.");
  return out;
}

function parseJSON(txt){
  let t=String(txt||"").trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(fence)t=fence[1].trim();
  const tries=[];
  tries.push(t);
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a>=0&&b>a) tries.push(t.slice(a,b+1));
  for(const cand of tries.slice()) tries.push(cand.replace(/,\s*([}\]])/g,"$1"));   // trailing-comma repair
  for(const cand of tries){ try{return JSON.parse(cand);}catch(e){} }
  const truncated=a>=0&&(t.lastIndexOf("}")<t.length-40||((t.match(/\{/g)||[]).length!==(t.match(/\}/g)||[]).length));
  throw new Error("Could not parse AI response as JSON"+(truncated?" — it looks cut off. Just hit the same button again (long replies now auto-continue).":"."));
}

/* light markdown -> html (math via KaTeX after insert) */
function md(src=""){
  let lines=esc(src).split(/\n/),out=[],list=null;
  const flush=()=>{if(list){out.push("</"+list+">");list=null;}};
  for(let ln of lines){
    let m;
    if((m=ln.match(/^\s*######?\s*(.*)/))){flush();out.push("<h4>"+inline(m[1])+"</h4>");continue;}
    if((m=ln.match(/^\s*###\s*(.*)/))){flush();out.push("<h4>"+inline(m[1])+"</h4>");continue;}
    if((m=ln.match(/^\s*##\s*(.*)/))){flush();out.push("<h3>"+inline(m[1])+"</h3>");continue;}
    if((m=ln.match(/^\s*#\s*(.*)/))){flush();out.push("<h2>"+inline(m[1])+"</h2>");continue;}
    if((m=ln.match(/^\s*[-*]\s+(.*)/))){if(list!=="ul"){flush();out.push("<ul>");list="ul";}out.push("<li>"+inline(m[1])+"</li>");continue;}
    if((m=ln.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){flush();out.push("<ol>");list="ol";}out.push("<li>"+inline(m[1])+"</li>");continue;}
    if(ln.trim()===""){flush();continue;}
    flush();out.push("<p>"+inline(ln)+"</p>");
  }
  flush();return out.join("\n");
  function inline(s){return s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");}
}

async function downloadPDF(el,filename,maxPages=2){
  if(!el){toast("Nothing to export yet");return;}
  if(!window.html2canvas||!window.jspdf){toast("PDF tools still loading — try again in a moment");return;}
  toast("Building PDF…");
  const RW=760; // fixed render width so the PDF looks identical on any screen
  const wrap=document.createElement("div");
  wrap.style.cssText="position:fixed;left:-10000px;top:0;width:"+RW+"px;background:#fff";
  const clone=el.cloneNode(true);
  clone.style.width=RW+"px";clone.style.maxWidth="none";clone.style.margin="0";
  wrap.appendChild(clone);document.body.appendChild(wrap);
  try{
    const canvas=await html2canvas(clone,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:RW,width:RW});
    const jsPDF=window.jspdf.jsPDF;
    const pdf=new jsPDF("p","pt","letter");
    const pageW=pdf.internal.pageSize.getWidth(),pageH=pdf.internal.pageSize.getHeight();
    const margin=36,usableW=pageW-margin*2,usableH=pageH-margin*2;
    let imgW=usableW,imgH=canvas.height*(imgW/canvas.width);
    if(imgH>usableH*maxPages){imgH=usableH*maxPages;imgW=canvas.width*(imgH/canvas.height);}
    const pages=Math.max(1,Math.ceil(imgH/usableH-0.001));
    const x=margin+(usableW-imgW)/2,sliceH=canvas.height/pages;
    for(let p=0;p<pages;p++){
      const sc=document.createElement("canvas");sc.width=canvas.width;sc.height=Math.ceil(sliceH);
      sc.getContext("2d").drawImage(canvas,0,p*sliceH,canvas.width,sliceH,0,0,canvas.width,sliceH);
      const sH=imgW*(sliceH/canvas.width);
      if(p>0)pdf.addPage();
      pdf.addImage(sc.toDataURL("image/jpeg",0.95),"JPEG",x,margin,imgW,sH);
    }
    pdf.save(filename);toast("Saved "+filename);
  }catch(e){toast("PDF error: "+e.message);}
  finally{wrap.remove();}
}

  const wkp=(7*p[0]+4*p[1])/1000, day=(8*p[0]+5*p[1])/1000, test=(8*p[0]+6*p[1])/1000, reb=(9*p[0]+6.5*p[1])/1000;
  const yr=36*wkp+190*day+48*test+25*reb;

    +"<div style='margin-top:5px'>Typical full year (36 week plans + ~190 day generations + ~48 quizzes/tests + ~25 rebuilds): <b>≈ $"+Math.round(yr)+"</b>. Heavy use, double it.</div>";
}

ont-family:var(--sans);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 5px;color:var(--indigo);font-weight:800}\n.matgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px}\n.matgrid li{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;line-height:1.28;list-style:none}.matgrid li svg{flex:none;margin-top:2px;width:14px;height:14px}\n.give{margin-top:7px;font-size:10px;line-height:1.32;background:var(--pine-bg);border:1px solid var(--pine-line);border-radius:9px;padding:6px 10px;color:var(--ink2)}.give b{color:var(--pine)}\n.ipad{margin-top:6px;font-size:10.5px;line-height:1.35;background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:9px;padding:6px 10px}.ipad b{color:var(--amber)}\n@media print{@page{size:letter landscape;margin:0}body,.screen{background:#fff;padding:0}.hint{display:none}.land{box-shadow:none;margin:0;break-after:page}.land:last-child{break-after:auto}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}.pw{position:relative;padding-left:20px;margin-top:5px}.pw::before{content:'';position:absolute;left:9px;top:7px;bottom:30px;width:2.5px;border-radius:3px;background:linear-gradient(180deg,#383CC1,#8B93F0 55%,#E7B449)}.pw-r{position:relative;display:grid;grid-template-columns:30px 1fr;gap:7px;margin-bottom:6px}.pw-node{position:relative;z-index:2}.pw-lv{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#fff;border:2px solid #383CC1;font-family:Georgia,serif;font-weight:700;font-size:12px;color:#383CC1}.pw-gr{display:block;font-family:ui-monospace,Consolas,monospace;font-size:7px;color:#5A6382;margin-top:2px;text-align:center;width:24px;margin-left:-1px}.pw-c{border:1px solid #E4E9F5;border-radius:8px;padding:4px 8px}.pw-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}.pw-course{font-family:Georgia,serif;font-size:11px;line-height:1.1;color:#1B2350}.pw-role{font-family:ui-monospace,Consolas,monospace;font-size:6.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#8A5300;background:#FBF1DF;border:1px solid #EAD4A6;border-radius:999px;padding:1px 5px}.pw-teks{font-family:ui-monospace,Consolas,monospace;font-size:7.5px;color:#5A6382;margin-left:auto}.pw-focus{font-size:8.5px;line-height:1.3;color:#111;margin:2px 0 3px}.pw-tags{display:flex;flex-wrap:wrap;gap:4px}.pw-tag{font-size:7.5px;font-weight:600;border-radius:5px;padding:2px 6px;line-height:1.15}.pw-tag.proj{background:#EAEBFB;color:#383CC1;border:1px solid #D5D9F5}.pw-tag.cert{background:#FBF1DF;color:#8A5300;border:1px solid #EAD4A6}.pw-cert{margin-top:3px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;background:#F4F5FC;border:1px solid #D5D9F5;border-radius:8px;padding:5px 9px}.pw-certlab{font-family:ui-monospace,Consolas,monospace;font-size:7px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#C48A1A}.pw-cert b{font-family:Georgia,serif;font-size:11px;color:#1B2350}.pw-certfacts{font-family:ui-monospace,Consolas,monospace;font-size:7.5px;color:#5A6382;margin-left:auto}.pw-note{margin-top:4px;font-size:7px;line-height:1.35;color:#5A6382;font-family:ui-monospace,Consolas,monospace}";
function sylPlot(){return '<svg class="pl" viewBox="0 0 116 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><line x1="0" y1="112" x2="116" y2="112" stroke="rgba(255,255,255,.2)" stroke-width="1.2"/><line x1="58" y1="6" x2="58" y2="196" stroke="rgba(255,255,255,.2)" stroke-width="1.2"/><path d="M30,44 Q58,200 86,44" fill="none" stroke="#A9B0FF" stroke-width="3" stroke-linecap="round"/><path d="M64,36 C78,82 88,104 112,108" fill="none" stroke="#E7B449" stroke-width="2.6" stroke-linecap="round"/><circle cx="58" cy="112" r="3.2" fill="#fff"/></svg>';}

function sylX(){return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#AF1235" stroke-width="2.8" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></svg>';}

    +'<p class="sub">'+sylFmt(welcome||g.welcome)+'</p>'
    +'<div class="id"><b>'+esc(((S.settings.titlePrefix||"")+" "+(S.settings.teacher||"")).trim()||"Your Teacher")+'</b> '+(S.settings.school?" \u00b7 "+esc(S.settings.school):"")+'<br><span class="g">'+esc(S.settings.teacherEmail||"")+'</span></div></div>'

function sylSideB(name,rmHtml,mats){

  return '<div class="rmhead"><div><span class="eyebrow" style="color:var(--indigo)">The Year at a Glance</span><h2>Course Roadmap</h2></div><div class="lg">'+esc(name)+'<br>tentative — may shift</div></div>'
    +(rmHtml||'<p style="font-size:9px;color:var(--muted);margin-top:8px">Roadmap pacing loads once this course has a pacing sequence.</p>')
    +'<div class="mat"><h3>Bring every day</h3><ul class="matgrid">'+matItems+'</ul>'
    +(function(){const cl=syllabusClassList();const line=cl.slice(0,-1).join(', ')+', or '+cl[cl.length-1];return '<div class="give"><b>For the class — bring one:</b> '+esc(line)+'.</div>';})()
    +'<div class="ipad">'+sylFmt(sylCfg().ipad)+'</div></div>';
}
function syllabusDoc(co){
  const name=(co&&co.name)||"Class"; const rm=syllabusRoadmap(co);
  const sylTitle=n=>{let t=String(n||'');const ix=[t.indexOf('('),t.indexOf(':')].filter(i=>i>0);if(ix.length)t=t.slice(0,Math.min.apply(null,ix));t=t.replace(/\s*[,;&]+\s*$/,'').replace(/\s+/g,' ').trim();if(t.length>38)t=t.slice(0,36).replace(/[\s,;]+\S*$/,'')+'…';return t;};
  const sylBlurb=n=>{let s=String(n||'');const i=s.indexOf(':');if(i>=0)s=s.slice(i+1);s=s.replace(/[()]/g,' ').replace(/\s+/g,' ').replace(/^[\s,;]+/,'').trim();if(s.length>96)s=s.slice(0,94).replace(/[\s,;]+\S*$/,'')+'…';return s;};
  let rmHtml="";
  [1,2].forEach(function(sem){ const rows=rm.filter(r=>r.sem===sem); if(!rows.length)return;
    rmHtml+='<div class="sem">Semester '+sem+' · '+(sem===1?'Fall':'Spring')+'</div><div class="tl">';
    rows.forEach(function(r){ const wk=r.units.reduce((a,u)=>a+((+u.weeks)||0),0); const t=sylTitle(r.units[0].unit);
      let blurb=r.units.map(u=>sylBlurb(u.unit)).filter(Boolean).join("; "); if(blurb.length>118)blurb=blurb.slice(0,116).replace(/[\s,;]+\S*$/,'')+'…';
      rmHtml+='<div class="r '+(r.mile?'gold':'')+'"><div class="w"><span class="p">'+r.p+' 6-Wks</span>'+esc(r.when)+'</div><div class="u"><span class="wks">'+wk+'w</span><h4>'+esc(t)+'</h4><p>'+esc(blurb)+(r.mile?'<br><span class="ms">'+r.mile+'</span>':'')+'</p></div></div>';
    });
    rmHtml+='</div>';
  });
  const A=sylSideA(name, co&&co.welcome), B=sylSideB(name,rmHtml,syllabusMaterials(co));
  const showPath=(typeof courseIsEng==="function")&&courseIsEng(co)&&((sylCfg().pathway&&sylCfg().pathway.stations)||[]).length;
  const C=showPath?sylSideC(co):null;
  const land=x=>'<div class="land"><div class="half">'+x+'</div><div class="cut"></div><div class="half">'+x+'</div></div>';
  return '<!doctype html><html><head><meta charset="utf-8"><title>'+esc(name)+' — Syllabus</title><style>'+SYL_CSS+'</style></head><body><div class="screen">'
    +'<div class="hint"><b>Print landscape, then cut on the dashed line.</b> '+(C?'This class prints <b>3 half-sheet sides</b> \u2014 policies + this year\u2019s roadmap (double-sided), plus the <b>4-Year Pathway</b> on its own.':'Print double-sided (flip on short edge): each student gets a 2-sided half-sheet \u2014 syllabus front, roadmap back.')+'</div>'
    +land(A)+land(B)+(C?land(C):'')
    +'</div></body></html>';
}
function sylSideC(co){
  const p=sylCfg().pathway||{}; const st=p.stations||[];
  const rows=st.map((s,i)=>'<div class="pw-r"><div class="pw-node"><span class="pw-lv">'+esc(s.level||(i+1))+'</span><span class="pw-gr">'+esc(s.grade||'')+'</span></div><div class="pw-c"><div class="pw-top"><span class="pw-course">'+esc(s.course||'')+'</span>'+(s.role?'<span class="pw-role">'+esc(s.role)+'</span>':'')+(s.teks?'<span class="pw-teks">'+esc(s.teks)+'</span>':'')+'</div><div class="pw-focus">'+sylFmt(s.focus||'')+'</div><div class="pw-tags">'+(s.project?'<span class="pw-tag proj">\u25B2 '+esc(s.project)+'</span>':'')+(s.cert?'<span class="pw-tag cert">\u25C6 '+esc(s.cert)+'</span>':'')+'</div></div></div>').join('');
  return '<div class="rmhead"><div><span class="eyebrow" style="color:#383CC1">Program of Study</span><h2>'+esc(p.title||'4-Year Pathway')+'</h2></div><div class="lg">'+esc(p.subtitle||'')+'</div></div><div class="pw">'+rows+'</div>'+(p.certName?'<div class="pw-cert"><span class="pw-certlab">Certification</span><b>'+esc(p.certName)+'</b><span class="pw-certfacts">'+esc(p.certFacts||'')+'</span></div>':'')+(p.note?'<div class="pw-note">'+esc(p.note)+'</div>':'');
}

function monthBlock(y,mo){
  const blk=el(`<div style="margin:14px 0"><div class="mlabel" style="margin-bottom:6px">${MON[mo]} ${y}</div><div class="cal"></div></div>`);
  const g=blk.querySelector(".cal");

  const first=new Date(y,mo,1),pad=first.getDay();
  for(let i=0;i<pad;i++)g.appendChild(el(`<div></div>`));
  const days=new Date(y,mo+1,0).getDate();
  for(let d=1;d<=days;d++){
    const is=iso(new Date(y,mo,d)),info=dayInfo(is);
    let cls="d";
    if(info.status==="off")cls+=" "+(S.calendar.events.find(e=>{const b=e.end||e.start;return is>=e.start&&is<=b&&e.type==="break"})?"break":"holiday");
    else if(info.status==="early")cls+=" early";
    else if(info.status==="weekend"||info.status==="out")cls+=" off";
    if(info.status==="test")cls+=" test";
    const cell=el(`<div class="${cls}">${d}${info.label?`<span class="lab">${esc(info.label)}</span>`:""}</div>`);
    if(info.status==="off"||info.status==="early"){cell.style.cursor="pointer";cell.title="Click to remove";cell.onclick=()=>{S.calendar.events=S.calendar.events.filter(e=>!(is>=e.start&&is<=(e.end||e.start)&&e.type!=="test"&&e.type!=="marker"));save();render();};}

/* ---------------------------------------------------------- YEAR ------ */
function teksMatch(codeA,codeB){ // does expectation/code A fall under B (or vice versa)?
  if(!codeA||!codeB) return false; codeA=String(codeA); codeB=String(codeB);
  if(codeA===codeB) return true;
  const under=(child,parent)=>child.startsWith(parent)&&!/[0-9]/.test(child.charAt(parent.length));
  return under(codeA,codeB)||under(codeB,codeA);
}
function coverageLedger(co){
  const full=TEKS[co.teks]&&TEKS[co.teks].full;
  const codes = full ? (full.strands||[]).flatMap(s=>(s.expectations||[]).map(e=>({code:e.code,text:e.text,staar:e.staar})))
                     : ((TEKS[co.teks]&&TEKS[co.teks].strands)||[]).map(s=>({code:s[0],text:s[1]}));
  const L={}; codes.forEach(c=>L[c.code]={info:c,taught:[],practiced:[],assessed:[]});
  let wkList=[]; try{wkList=schoolWeeks();}catch(e){}
  const plans=S.plans[co.id]||{};
  for(const w of wkList){ const p=plans[w.key]; if(!p) continue; const wTeks=p.teks||[]; if(!wTeks.length) continue;
    const days=p.days||{}; const active=WD.filter(d=>days[d]&&days[d].objective&&days[d].objective!=="No School for Students");
    if(!active.length) continue;
    const match=code=>wTeks.some(t=>teksMatch(code,t));
    for(const c of codes){ if(!match(c.code)) continue;
      L[c.code].taught.push(w.key);
      for(const d of active){ const m=days[d];
        const how = (m.useCk12&&m.ck12)?"CK-12":(m.customWorksheet?"your worksheet":((m.worksheet&&(m.worksheet.sections||[]).length)?"worksheet":null));
        if(how) L[c.code].practiced.push({week:w.key,day:d,how}); } } }
  Object.values(S.tests[co.id]||{}).forEach(t=>(t.items||[]).forEach(it=>{ const nm=t.title||t.label||"test";
    Object.keys(L).filter(k=>teksMatch(k,it.teks)).forEach(k=>{ if(!L[k].assessed.includes(nm))L[k].assessed.push(nm); }); }));
  // pacing = "planned later"
  const planned=new Set();
  const P=(window.PACING_LOCAL||{})[co.teks];
  if(P&&P.pacing) P.pacing.forEach(u=>String(u.teks||"").split(/[,;]\s*/).forEach(t=>{if(t.trim())planned.add(t.trim());}));
  return {codes,L,planned};
}
function coverageCard(co){

  const assessed=codes.filter(c=>L[c.code].assessed.length);
  const gapNotScheduled=codes.filter(c=>!L[c.code].taught.length);
  const gapNoPractice=taught.filter(c=>!L[c.code].practiced.length);
  const gapNoAssess=practiced.filter(c=>!L[c.code].assessed.length);
  const bar=(lab,n,color)=>'<div style="margin:5px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><b>'+lab+'</b><span>'+n+' / '+N+'</span></div><div style="height:8px;background:var(--clay-soft);border-radius:99px;overflow:hidden"><div style="height:100%;width:'+Math.round(n/N*100)+'%;background:'+color+'"></div></div></div>';
  const chips=arr=>arr.slice(0,40).map(c=>'<span class="pill" title="'+esc(((c&&(c.text||(c.info&&c.info.text)))||"").slice(0,140))+'">'+esc((c&&c.code)||"")+((c&&(planned.has(String(c.code).split(".")[0])||planned.has(c.code)))?" 🗓":"")+'</span>').join(" ")+(arr.length>40?" +"+(arr.length-40)+" more":"");
  const card=el('<div class="card"><h2>📋 TEKS coverage — live ledger</h2>'
    +'<p class="sub">Recomputed from the actual planned weeks every time you change anything — move a day, swap a worksheet, use CK-12, and this updates. Practice counts your worksheet OR the CK-12 lesson. 🗓 = sits in the pacing plan for later.</p>'
    +bar("Taught (scheduled in a week)",taught.length,"var(--clay)")
    +bar("Practiced (worksheet / CK-12 / yours)",practiced.length,"var(--green)")
    +bar("Assessed (on a quiz or test)",assessed.length,"var(--gold)")
    +(gapNotScheduled.length?'<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600;font-size:13px">❌ Not scheduled yet ('+gapNotScheduled.length+')</summary><div style="margin-top:6px;line-height:2">'+chips(gapNotScheduled)+'</div></details>':'<p class="sub" style="margin-top:8px">✅ Every expectation is scheduled.</p>')
    +(gapNoPractice.length?'<details><summary style="cursor:pointer;font-weight:600;font-size:13px">🟡 Taught but never practiced ('+gapNoPractice.length+')</summary><div style="margin-top:6px;line-height:2">'+chips(gapNoPractice)+'</div></details>':"")
    +(gapNoAssess.length?'<details><summary style="cursor:pointer;font-weight:600;font-size:13px">🟠 Practiced but never assessed ('+gapNoAssess.length+')</summary><div style="margin-top:6px;line-height:2">'+chips(gapNoAssess)+'</div></details>':"")

/* ---- Fill a course's whole year from an imported publisher curriculum (ATA Pre-Calculus).
   Lays the unit sequence onto the REAL school calendar: skips no-school days, marks quiz/test/review
   days, records which unit + homework + PDF page each day comes from, and never touches a LOCKED day. */
function ataFill(co,opts){
  const SRC=window.ATA_PRECAL||[]; if(!SRC.length){toast("ATA curriculum file not loaded");return 0;}
  opts=opts||{};
  const weeks=schoolWeeks(); let si=0, filled=0, skippedLocked=0;
  S.plans[co.id]=S.plans[co.id]||{};
  for(const w of weeks){
    if(si>=SRC.length) break;
    const p=S.plans[co.id][w.key]=S.plans[co.id][w.key]||{teks:[],carryOver:"",days:{}};
    p.days=p.days||{};
    for(const d of WD){
      if(si>=SRC.length) break;
      const wd=w.days.find(x=>x.day===d); const inf=wd?dayInfo(wd.iso):null;
      if(inf&&inf.status==="off"){ p.days[d]=p.days[d]||{objective:"No School for Students"}; continue; }
      const cur0=p.days[d];
      if(cur0&&cur0.locked){ skippedLocked++; continue; }   // never overwrite finished work — and do NOT burn a curriculum day on it
      const a=SRC[si++];
      const isTest=a.kind==="test", isQuiz=a.kind==="quiz", isRev=a.kind==="review";
      const objective = isTest ? (a.unit+" — UNIT TEST")
                      : isQuiz ? (a.topic+" — quiz over the recent lessons")
                      : isRev  ? (a.unit+" — review before the unit test")
                      : ("Students will learn and practice "+a.topic+".");   // ATA topics are NOUN phrases ("Complex Numbers"), so frame them
      p.days[d]=Object.assign({},cur0,{
        objective, type: isTest?"test":(isQuiz?"quiz":(isRev?"review":"worksheet")),
        ataRef:{unit:a.unit,unitDay:a.unitDay,topic:a.topic,hw:a.hw,page:a.page,pdf:a.pdf,seq:a.seq}
      });
      filled++;
    }
  }
  save();
  toast("Filled "+filled+" days from your curriculum"+(skippedLocked?(" ("+skippedLocked+" locked days kept)"):""));
  return filled;
}

/* ---- Deterministic Year-at-a-Glance: lay units across the real calendar, prove STAAR fits ---- */
const YAG_PAL=['#cfe0f1','#d8ecdd','#f6e0d6','#f7eccf','#e7ddf0','#dcefe9','#f0dce2','#e4ead6','#d5e3f2','#f3e1cd','#dfe8d7','#ece0ee'];
function weekTeachDays(wk){return wk.days.filter(d=>d.iso>=S.calendar.firstDay&&d.iso<=S.calendar.lastDay&&["school","early","test"].includes(dayInfo(d.iso).status)).length;}
function eocWeekIndex(weeks){
  const spring=(S.calendar.events||[]).filter(e=>e.type==="test"&&(()=>{const m=pdate(e.start).getMonth();return m>=2&&m<=6;})());
  if(!spring.length)return -1;
  spring.sort((a,b)=>a.start<b.start?-1:1);
  const eoc=spring[0];
  return weeks.findIndex(w=>w.days.some(d=>d.iso>=eoc.start&&d.iso<=(eoc.end||eoc.start)));
}
function buildYAG(co){
  const weeks=schoolWeeks();
  const pk=pacingFor(co); const units=(pk&&pk.units)||[];
  const staar=!!(TEKS[co.teks]&&TEKS[co.teks].staar);
  const eocIdx=staar?eocWeekIndex(weeks):-1;
  const reviewWeeks=staar?2:0;
  const map=weeks.map((w,i)=>({i,label:"Wk "+(i+1),range:weekLabel(w),gp:gradingPeriodOf(w.days[0].iso),cap:weekTeachDays(w),unit:null,unitIndex:null,kind:"teach"}));
  map.forEach(m=>{if(m.cap===0){m.kind="off";m.unit="No school";}});
  const firstTeach=map.find(m=>m.kind==="teach"); if(firstTeach){firstTeach.kind="soft";firstTeach.unit="Soft start: procedures · syllabus · Core 4 · diagnostic";}
  const reserved=new Set();
  if(eocIdx>=0){reserved.add(eocIdx);for(let r=1;r<=reviewWeeks;r++){const idx=eocIdx-r;if(idx>0)reserved.add(idx);}}
  const teachSlots=map.filter(m=>m.kind==="teach"&&!reserved.has(m.i));
  const warnings=[]; const placed=[]; let ranOut=false, cum=0;
  units.forEach((u,ui)=>{const name=u[0]; const wks=Math.max(0.5,(+u[1])||1);
    let start=Math.round(cum); cum+=wks; let end=Math.round(cum);
    if(end<=start)end=start+1;                          // every unit gets at least one week
    for(let s=start;s<end;s++){
      if(s>=teachSlots.length){ranOut=true;break;}
      const slot=teachSlots[s];slot.unit=name;slot.unitIndex=ui;placed.push(slot);
    }});
  if(ranOut)warnings.push("⚠ Ran out of weeks — not every unit fits before the year ends. Trim a unit's weeks (in the TEKS sequence) or shorten review.");
  map.forEach(m=>{if(reserved.has(m.i)){m.kind=(m.i===eocIdx)?"eoc":"review";m.unit=(m.i===eocIdx)?"STAAR EOC window":"EOC review";}});
  // ---- split leftover buffer: guarantee ~10 truly-FREE blow-off days, bank the rest as review on the hard units ----
  {
    const bufCells=map.filter(m=>m.kind==="teach"&&m.unitIndex===null);
    const uw=units.map((u,i)=>[i,Math.max(0.5,(+u[1])||1)]);
    const hardSet=new Set(uw.filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,Math.max(1,Math.ceil(units.length/3))).map(x=>x[0]));
    const prevUnitCell=idx=>{for(let j=idx-1;j>=0;j--){if(map[j].kind==="teach"&&map[j].unitIndex!==null)return map[j];}return null;};
    let freeBudget=Math.min(10,bufCells.reduce((a,m)=>a+(m.cap||0),0)); // ~10 days you can just blow off
    bufCells.forEach(m=>{ const cap=m.cap||0;
      if(freeBudget>0&&cap>0){ m.unit="🌤 Flex / catch-up — free (make-up · reteach · breathe)"; m.bufKind="free"; freeBudget-=cap; }
      else { const pv=prevUnitCell(m.i); m.unit=(pv&&hardSet.has(pv.unitIndex))?("🔁 Review + reteach — "+units[pv.unitIndex][0]):"🔁 Spiral review / catch-up"; m.bufKind="review"; } });
  }
  if(staar&&eocIdx>=0&&placed.length){
    const lastTaught=placed[placed.length-1].i;
    if(lastTaught>=eocIdx)warnings.push("⚠ Tested instruction ends AFTER the STAAR EOC window — move heavier units earlier or trim one.");
    else if(lastTaught>eocIdx-reviewWeeks-1)warnings.push("Tight: instruction runs right up to the EOC with little review buffer.");
  }
  // ---- day budget / wiggle room (DAY-based, not week-slot) ----
  const dOf=m=>m.cap||0;
  const instrDays=map.reduce((a,m)=>a+dOf(m),0);
  const bufferCells=map.filter(m=>m.kind==="teach"&&m.unitIndex===null);
  const unitDays=map.filter(m=>m.kind==="teach"&&m.unitIndex!==null).reduce((a,m)=>a+dOf(m),0);
  const bufferDays=bufferCells.reduce((a,m)=>a+dOf(m),0);
  const teachableDays=unitDays+bufferDays;                         // real M–F days available for the sequence
  const daysNeeded=Math.round(units.reduce((a,u)=>a+(+u[1]||1),0)*5);
  const surplus=teachableDays-daysNeeded;
  const budget={instrDays,unitDays,bufferDays,teachableDays,daysNeeded,surplus,
    softDays:map.filter(m=>m.kind==="soft").reduce((a,m)=>a+dOf(m),0),
    reviewDays:map.filter(m=>m.kind==="review"||m.kind==="eoc").reduce((a,m)=>a+dOf(m),0),
    freeDays:map.filter(m=>m.bufKind==="free").reduce((a,m)=>a+dOf(m),0),
    reviewBufDays:map.filter(m=>m.bufKind==="review").reduce((a,m)=>a+dOf(m),0),
    bufferWeeks:bufferCells.length, fridayBuffer:bufferCells.length};
  if(surplus<0)warnings.push("⚠ BEHIND by ~"+(-surplus)+" teaching days — the sequence needs ~"+daysNeeded+" but only ~"+teachableDays+" are available after soft start, review, and short weeks. Trim ~"+Math.ceil(-surplus/5)+" week(s) from the heaviest unit.");
  else if(surplus<5)warnings.push("Tight: only ~"+surplus+" buffer day(s) of wiggle room all year.");
  return {map,units,staar,eocIdx,warnings,placedCount:placed.length,budget};
}

async function _genWeekCore(co,wk,statusEl,extra=""){

// Generate EVERY teaching day's handouts for a plan that already exists — the "hit one button, walk away" path.
async function genAllMaterials(co,wk,plan,statusEl,force){
  const _t0=Date.now();
  const _tick=setInterval(()=>{const sec=Math.round((Date.now()-_t0)/1000);const ph=statusEl.getAttribute('data-phase')||'writing handouts';statusEl.innerHTML='<span class="spinner"></span> '+ph+'… '+(sec<60?sec+"s":Math.floor(sec/60)+"m "+String(sec%60).padStart(2,"0")+"s")+" — you can leave this tab open and come back.";},1000);
  try{
    const teach=WD.filter(d=>{const wd=wk.days.find(x=>x.day===d);const inf=wd?dayInfo(wd.iso):null;const dd=plan.days&&plan.days[d];return dd&&!dd.locked&&dd.objective&&dd.objective!=="No School for Students"&&(!inf||inf.status!=="off");});
    const todo=force?teach:teach.filter(d=>{const dd=plan.days[d];return !(dd.worksheet||dd.guidedNotes||dd.notes);});
    if(!todo.length){ statusEl.textContent='✓ All handouts already made — scroll down to print.'; return; }
    let okc=0; const fails=[]; const BATCH=1;   // one in-flight call at a time — see credit-reservation note in _genWeekCore
    for(let i=0;i<todo.length;i+=BATCH){
      const chunk=todo.slice(i,i+BATCH);
      statusEl.setAttribute('data-phase','writing handouts — day '+(i+1)+(chunk.length>1?'–'+(i+chunk.length):'')+' of '+todo.length);
      await Promise.all(chunk.map(d=>Promise.resolve(genMaterials(co,wk,plan,d,plan.days[d],document.createElement("span"),"")).catch(()=>{})));
      save();
    }
    todo.forEach(d=>{ if(plan.days[d]&&(plan.days[d].worksheet||plan.days[d].guidedNotes)) okc++; else fails.push(d); });
    save();render();
    if(fails.length){ statusEl.textContent='⚠ Made '+okc+' of '+todo.length+'. Didn’t finish: '+fails.join(", ")+' — press the button again to retry those.'; toast('⚠ '+okc+'/'+todo.length+' days; '+fails.join(", ")+' need a retry'); }
    else { statusEl.textContent='✓ Done — all '+okc+' days have handouts. Spot-check the math, then print.'; toast('✓ All '+okc+' days ready to print.'); }
  }catch(e){ statusEl.textContent="✗ "+e.message; toast("✗ "+e.message); try{diagLog("genfail","allmat: "+e.message);}catch(_){} }
  finally{ clearInterval(_tick); }
}

function extendTime(co,wk,plan){
  const n=Math.max(1,Math.min(3,parseInt(prompt("Spend how many extra days on the current topic? (1–3)\nThe week slows down and the rest carries into the following weeks.","1"))||0));
  if(!n)return;
  const warn=TEKS[co.teks]?.staar?" NOTE: this course has a STAAR EOC in late April — don't extend so far you can't finish tested TEKS before it.":"";
  genWeek(co,wk,$("#st")||document.createElement("span"),`The teacher needs MORE TIME on the current / most-complex topic — slow down and stretch it across about ${n} more day(s): add guided practice, a checkpoint, and reteach time instead of starting new topics. It is fine not to finish this week; set carryOver to exactly what should continue next week.${warn}`);
}

/* ---- teacher daily guide: what you're teaching + a timed flow ---- */
function dayFlow(dd,minutes){
  const ag=asList(dd.agenda); if(!ag.length)return [];
  const n=ag.length, tot=minutes||45, t=new Array(n).fill(0);
  if(n===1){t[0]=tot;}
  else{ t[0]=Math.min(7,Math.max(4,Math.round(tot*0.12))); t[n-1]=Math.min(7,Math.max(4,Math.round(tot*0.1)));
    const mid=tot-t[0]-t[n-1], each=Math.max(4,Math.round(mid/(n-2||1)));
    for(let k=1;k<n-1;k++)t[k]=each; }
  return ag.map((s,k)=>({step:s,min:t[k]}));
}
/* the "teacher brain": a step-by-step script with real options (present vs video, spillover, etc.) */
function buildScript(dd,co){
  if(Array.isArray(dd.script)&&dd.script.length) return dd.script;
  const flow=dayFlow(dd,co.classMinutes);
  const hasVideo=dd.video&&(dd.video.short||dd.video.long||(dd.video.questions||[]).length);
  const hasPres=dd.presentation&&(dd.presentation.slides||[]).length;
  const hasNotes=!!dd.notes, hasWS=dd.worksheet&&(dd.worksheet.sections||[]).length;
  return flow.map(f=>{
    const t=(f.step||"").toLowerCase(); let move="",opts=[],say="";
    if(/bell|warm/.test(t)){move="Post the bell ringer; students start silently while you take attendance.";if(hasVideo)opts=["Or open with the short video as the hook"];say=dd.hook?String(dd.hook).replace(/\*\*/g,""):"";}
    else if(/go over|review bell/.test(t)){move="Go over the bell ringer together — have a couple of students share.";}
    else if(/mini|intro|lesson|notes|model|teach/.test(t)){move=hasNotes?"Work the guided notes and model each example ('I do').":"Model the worked examples on the board.";if(hasPres)opts.push("Present the slides");if(hasVideo)opts.push("Skip slides — play the video, then work 2 examples");opts.push("If yesterday spilled over: 2-min recap, then continue");say="Narrate your thinking step by step.";}
    else if(/guided/.test(t)){move="Guided practice — do the first problem of each type together, then release.";}
    else if(/independent|practice|worksheet/.test(t)){move=hasWS?"Students work the worksheet; circulate and spot-check.":"Independent practice; circulate.";opts=["Early finishers: the 🌶 Challenge problems"];if(hasVideo)opts.push("Short on time? Assign the video + questions as today's practice");}
    else if(/exit/.test(t)){move="Exit ticket — collect on the way out; use it to plan tomorrow.";}
    return {min:f.min,title:f.step,do:move,options:opts,say:say};
  });
}

/* gate generated materials against his bar before they can save (QA: 0/5 shipped with structural defects) */
function validateDay(d,opts){
  opts=opts||{}; const issues=[], warn=[]; const ws=d.worksheet||{};
  {const mins=(d.script||[]).reduce((a,s)=>a+(+s.min||0),0);
   if(mins&&mins<45&&d.objective!=="No School for Students") warn.push("script only covers "+mins+" min — under a 45-min period; add or lengthen a block");
   const gx=(d.guidedNotes&&d.guidedNotes.examples||[]).length; if(gx>3) warn.push(gx+" notes examples — too many for a half-sheet (keep 1-3)");}
  if((ws.sections||[]).length){
    let probs=0; (ws.sections||[]).forEach((s,i)=>{ const p=(s.problems||[]); probs+=p.length;
      if(p.length&&/^\s*🌶/.test(String(p[p.length-1]))) warn.push("section "+(i+1)+" ends on a 🌶 challenge — move it to the interior");
      if(p.length>1&&/^\s*🌶/.test(String(p[0]))) warn.push("section "+(i+1)+" leads off with a 🌶 challenge — move it to the interior");
    });
    const practice=probs;  // count BEFORE the challenge; target ~8-12 for a 45-min class (scale by difficulty)
    if(!/quiz|test/.test(d.type||"")){
      if(practice<6) warn.push("only "+practice+" practice problems — light for a full period (aim ~8-12)");
      else if(practice>14) warn.push(practice+" practice problems — likely too many for one class (aim ~8-12)");
    }
    probs+=(ws.optionalExtra||[]).length;
    const ansN=(d.answerKey||[]).reduce((a,k)=>a+(k.answers||[]).length,0);
    if(!ansN){ if(opts.hum) warn.push("no per-item answer key — writing/open-ended day; add model answers or a rubric"); else issues.push("answer key is empty"); }
    else if(ansN<probs) warn.push("answer key is short: "+ansN+" answers for "+probs+" problems");
    (d.answerKey||[]).forEach(k=>(k.answers||[]).forEach(a=>{const s=String(a).trim(); if(/(only|\.\.\.|…)$/i.test(s)||/[+\-*/=(,]$/.test(s)) warn.push("an answer looks truncated: \""+s.slice(0,28)+"\"");}));
  }
  if(opts.needNotes){ const n=String(d.notes||"").trim();
    if(!n||n==="{}"||n.length<40) issues.push("student NOTES missing/too short (this is the graded-day deliverable)");
    else { if(/self-verif|hard rule|meets bar|grader|as required by/i.test(n)) issues.push("NOTES contains grader/meta text — must be student-facing");
           if(!/you\s*try|now try|try (it|this|these)/i.test(n)) warn.push("NOTES has no 'You Try' practice"); }
  }
  if(d.guidedNotes){ const g=d.guidedNotes;
    // a {{blank}} that opens while inside a $...$ span prints broken — the #1 guided-notes defect
    const clozeInMath=s=>{ s=String(s||""); let inMath=false;
      for(let i=0;i<s.length;i++){ if(s[i]==='$') inMath=!inMath; if(s[i]==='{'&&s[i+1]==='{'&&inMath) return true; } return false; };
    const strs=[]; (g.vocab||[]).forEach(v=>strs.push(v.def||v.definition||"")); if(g.worked)(g.worked.steps||[]).forEach(s=>strs.push(s)); if(g.summary)strs.push(g.summary);
    if(strs.some(clozeInMath)) warn.push("guided notes nests a {{blank}} inside $...$ — renders fine now, but cleaner to close the math first");
    if(!strs.some(s=>/\{\{/.test(String(s)))) warn.push("guided notes has no {{blanks}} to fill in together");
    (g.youTry||[]).forEach((y,i)=>{ if(!String(y.answer||"").trim()) warn.push("guided notes You Try #"+(i+1)+" has no answer for the teacher key"); });
  }
  // GUARD (quality sweep): no on-ramp example may pre-solve a worksheet problem — and NEVER a challenge; every section modeled
  {const norm=s=>String(s||"").toLowerCase().replace(/\s+/g,"").replace(/[*\\$]/g,"");
   const practice=new Set(),chal=new Set();
   (ws.sections||[]).forEach(s=>(s.problems||[]).forEach(p=>{practice.add(norm(p)); if(/^\s*🌶/.test(String(p)))chal.add(norm(p));}));
   (ws.optionalExtra||[]).forEach(p=>{practice.add(norm(p));chal.add(norm(p));});
   const models=[];
   (d.guidedNotes&&d.guidedNotes.examples||[]).forEach(e=>models.push(e.prompt));
   (d.guidedNotes&&d.guidedNotes.youTry||[]).forEach(y=>models.push(y.prompt));
   (d.procedureExamples||[]).forEach(e=>models.push(e.prompt));
   (d.presentation&&d.presentation.slides||[]).forEach(s=>{if(s.example)models.push(s.example);if(s.youTry)models.push(s.youTry);});
   models.forEach(m=>{const k=norm(m); if(!k)return; if(chal.has(k))issues.push('an on-ramp example pre-solves a 🌶 challenge: "'+String(m).slice(0,30)+'"'); else if(practice.has(k))warn.push('an on-ramp example duplicates a worksheet problem verbatim: "'+String(m).slice(0,30)+'"');});
   const E=(d.guidedNotes&&d.guidedNotes.examples||[]).length + (d.procedureExamples||[]).length + (d.presentation&&d.presentation.slides||[]).filter(s=>s.example).length;
   if((ws.sections||[]).length && E < (ws.sections||[]).length) warn.push("only "+E+" worked examples for "+(ws.sections||[]).length+" worksheet sections — a section may be unmodeled");
  }
  // SCIENCE quality bar: an instructional science day MUST carry a labeled diagram and a "Word bank" — else it's math-shaped and gets rejected (triggers a retry)
  if(opts.sci && d.objective && d.objective!=="No School for Students" && !/quiz|test/.test(d.type||"")){
    const g=d.guidedNotes||{}; const isSvg=x=>typeof x==="string"&&/<svg/i.test(x);
    const hasFig = isSvg(g.figure) || (g.examples||[]).some(e=>isSvg(e.figure)) || (d.presentation&&d.presentation.slides||[]).some(s=>isSvg(s.graph)||isSvg(s.figure));
    if(!hasFig) issues.push("science day has NO labeled diagram — draw an inline <svg> in guidedNotes.figure or on a slide");
    if(g.title && !/word bank/i.test(g.boxLabel||"")) issues.push("science notes must label the reference box 'Word bank' (not '"+(g.boxLabel||"Formula bank")+"')");
  }
  return {ok:!issues.length, issues, warn};
}

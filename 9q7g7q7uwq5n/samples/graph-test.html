<!doctype html><html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#EBEEF6;font-family:system-ui,Arial;padding:16px}
  h1{font:700 16px ui-monospace,Consolas;color:#383CC1;margin:4px 0 14px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .cell{background:#fff;border:1px solid #E4E9F5;border-radius:12px;padding:8px}
  .cell .t{font:700 11px ui-monospace,Consolas;color:#1B2350;margin:2px 2px 6px}
  .cell svg{width:100%;height:auto;display:block}
  @page{size:13in 9in;margin:0}
</style></head><body>
<h1>plotSvg — every graph kind (correctness check)</h1>
<div class="grid" id="g"></div>
<script src="../deck-plot.js"></script>
<script>
const CASES=[
 ["line  y=2x-1",{kind:"line",m:2,b:-1}],
 ["parabola  x²-4x+3",{kind:"parabola",a:1,b:-4,c:3,domain:[-1,5],marks:[{x:2,y:-1,label:"V"}]}],
 ["down parabola",{kind:"parabola",a:-1,b:2,c:3,domain:[-3,5]}],
 ["cubic  x³-3x",{kind:"cubic",a:1,b:0,c:-3,d:0,domain:[-3,3]}],
 ["abs  |x-1|-2",{kind:"abs",a:1,h:1,k:-2,domain:[-4,6]}],
 ["sqrt  √(x-1)",{kind:"sqrt",a:1,h:1,k:0,domain:[-1,9]}],
 ["exp  2^x",{kind:"exp",a:1,b:2,k:0,domain:[-3,4]}],
 ["log  ln(x)",{kind:"log",b:Math.E,h:0,k:0,domain:[-1,8]}],
 ["log2  log2(x)",{kind:"log",b:2,h:0,k:0,domain:[-1,9]}],
 ["sin  2sin(x)",{kind:"sin",a:2,b:1,c:0,d:0,domain:[-6.5,6.5]}],
 ["cos  cos(2x)",{kind:"cos",a:1,b:2,c:0,d:0,domain:[-6.5,6.5]}],
 ["tan  tan(x)",{kind:"tan",a:1,b:1,domain:[-4.6,4.6]}],
 ["circle  r=3 @(1,-1)",{kind:"circle",h:1,k:-1,r:3}],
 ["points scatter",{kind:"points",pts:[[-3,2],[-1,-1],[0,0],[2,3],[3,-2],[4,4]]}],
 ["curve  x^2-3",{kind:"curve",expr:"x^2 - 3",domain:[-4,4]}],
 ["curve  sin(x)/x",{kind:"curve",expr:"sin(x)/x",domain:[-9,9]}],
 ["two curves  x² & 2x",{kind:"parabola",a:1,b:0,c:0,domain:[-3,3],expr2:"2*x"}],
 ["rational  1/x",{kind:"curve",expr:"1/x",domain:[-5,5]}],
 ["exp decay  3(0.5)^x",{kind:"exp",a:3,b:0.5,k:0,domain:[-3,5]}],
 ["wide parabola  0.2x²",{kind:"parabola",a:0.2,b:0,c:0,domain:[-6,6]}]
];
document.getElementById("g").innerHTML=CASES.map(c=>'<div class="cell"><div class="t">'+c[0]+'</div>'+window.plotSvg(c[1])+'</div>').join("");
</script></body></html>

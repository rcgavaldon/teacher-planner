<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#f5f4ef; --panel:#fffdf9; --ink:#2b2a27; --muted:#6f6b63; --line:#e6e2d8;
  --clay:#cc785c; --clay-d:#b5634a; --clay-soft:#f3e3dc; --gold:#d9a441;
  --green:#3f7d62; --blue:#3a6ea5; --red:#b4493b;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(40,30,20,.06);
  --radius:14px; --radius-sm:9px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--clay-d)}
h1,h2,h3,h4{margin:.2em 0 .4em;font-weight:650;letter-spacing:-.01em}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}
label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin:10px 0 4px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:160px}

/* top bar */
header.app{position:sticky;top:0;z-index:50;background:rgba(245,244,239,.85);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.app-in{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:17px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(145deg,var(--clay),var(--gold));box-shadow:var(--shadow)}
nav.tabs{display:flex;gap:2px;margin-left:6px;flex-wrap:wrap}
nav.tabs button{border:none;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 13px;border-radius:99px}
nav.tabs button:hover{color:var(--ink);background:rgba(204,120,92,.08)}
nav.tabs button.active{color:var(--clay-d);background:var(--clay-soft)}
.ctx{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}

main{max-width:1180px;margin:0 auto;padding:26px 22px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.card h2{font-size:19px}
.sub{color:var(--muted);font-size:13.5px;margin:-2px 0 14px}
.grid{display:grid;gap:16px}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1fr 1fr 1fr}}

.btn{background:var(--clay);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 16px;font-weight:650;font-size:14px;box-shadow:var(--shadow)}
.btn:hover{background:var(--clay-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--clay);color:var(--clay-d)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btnbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--clay-soft);color:var(--clay-d)}
.pill.green{background:#e2efe8;color:var(--green)} .pill.blue{background:#e3edf6;color:var(--blue)}
.pill.red{background:#f6e3e0;color:var(--red)} .pill.gray{background:#eceae4;color:var(--muted)}
.pill.gold{background:#f7ecd2;color:#9a6f15}

.empty{color:var(--muted);text-align:center;padding:30px;border:1.5px dashed var(--line);border-radius:var(--radius)}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;margin-bottom:10px}
.item:hover{border-color:var(--clay)}
.item .grow{flex:1}
.item .t{font-weight:650}
.item .m{font-size:12.5px;color:var(--muted)}

/* calendar mini */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:2px}
.cal .d{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;font-size:12px;padding:4px;background:#fff;position:relative;overflow:hidden}
.cal .d.off{background:#f4f1ea;color:var(--muted)}
.cal .d.holiday{background:#f6e3e0}.cal .d.break{background:#efe7da}.cal .d.early{background:#f7ecd2}
.cal .d.test{outline:2px solid var(--blue);outline-offset:-2px}
.cal .d .lab{font-size:8.5px;line-height:1.1;color:var(--muted);display:block;margin-top:2px}
.cal .mlabel{grid-column:1/-1;font-weight:700;margin:8px 0 2px}

/* week grid */
.weekgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.day{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;min-height:120px}
.day h4{margin:0 0 2px;font-size:13.5px}
.day .date{font-size:11.5px;color:var(--muted)}
.day .obj{font-size:13px;margin:8px 0}
.day.off{background:#f4f1ea}
.day .mini{font-size:12px;color:var(--muted);margin-top:auto}

/* EPISD lesson plan table (print-faithful) */
.lp{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff}
.lp td,.lp th{border:1px solid #333;padding:5px 6px;vertical-align:top}
.lp .hdr td{background:#f4f1ea;font-weight:700}
.lp .sec{background:#eceae4;font-weight:700;font-size:11px}
.lp .dcol{width:20%}
.lp .prompt{font-weight:400;color:#555;font-size:10px}

/* doc (notes / worksheet) */
.doc{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:26px 30px;line-height:1.6}
.doc h2{font-size:18px}.doc h3{font-size:15px;margin-top:16px}.doc h4{font-size:13.5px;margin-top:12px}
.doc .wstack{margin:14px 0}
.worked{background:#f7f4ee;border-left:3px solid var(--clay);border-radius:6px;padding:10px 14px;margin:10px 0}
.worked .tag{font-size:11px;font-weight:700;color:var(--clay-d);text-transform:uppercase;letter-spacing:.04em}
.prob{margin:10px 0;padding-bottom:6px}
.prob .q{font-weight:600}
.workspace{border:1px dashed #bbb;border-radius:6px;height:70px;margin-top:6px;background:repeating-linear-gradient(transparent,transparent 22px,#eee 22px,#eee 23px)}
.vidblock{border-left:3px solid var(--blue)}
.vidblock a{font-weight:600;color:var(--blue)}
table.vocab{border-collapse:collapse;width:100%;font-size:13px}
table.vocab td,table.vocab th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.vocab th{background:#f4f1ea}
table.vocab tr.diff td{background:#f6e3e0}
.gridbox{height:150px;border:1px solid #ccc;border-radius:6px;margin:8px 0;background-image:linear-gradient(#e8e8e8 1px,transparent 1px),linear-gradient(90deg,#e8e8e8 1px,transparent 1px);background-size:18px 18px}
.drawbox{height:140px;border:1px dashed #bbb;border-radius:6px;margin:8px 0;background:#fcfbf8}
.figsvg{margin:8px 0;text-align:center}
.figsvg svg{max-width:100%;height:auto}
.figcap{font-size:12.5px;color:var(--muted);margin:8px 0 2px}
.prob .qn{display:inline-block;min-width:30px;font-weight:700;color:var(--clay-d)}
.ansline{margin-top:6px;font-size:13px;color:var(--muted)}
.ansbox{display:inline-block;width:130px;height:22px;border:1px solid #888;border-radius:4px;vertical-align:middle;margin-left:6px;background:#fff}
.wstack.optional{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.wstack.optional h4{color:var(--muted)}
.editmode .editsec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:#fbfaf7}
.choices{margin:6px 0 0 18px;font-size:13.5px;line-height:1.7}
.bubbles{font-size:13px}
.brow{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid #f0ede6}
.brow .bn{width:26px;text-align:right;font-weight:700;color:var(--muted)}
.brow .bub{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1.5px solid #888;border-radius:50%;font-size:11px;color:#555}
.testsched{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;margin-bottom:8px}
.testsched.due{border-color:var(--gold);background:#fdf7ea}
.hookbox{border-left:3px solid var(--gold);background:#fdf9ef;padding:10px 14px}
.slidecard{margin:8px 0}
.slidecard h4{margin:2px 0 6px;font-size:15px}
ol.steps{margin:6px 0 6px 4px}
ol.steps li{margin:3px 0}
.slideshow .slidewrap{width:min(1040px,94vw);height:min(620px,86vh);background:#fff;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.22)}
.slideshow .sbar{height:3px;background:var(--line);flex:none}
.slideshow .sbar .sfill{height:100%;background:var(--clay);transition:width .2s}
.slideshow .slide{flex:1;padding:48px 56px;overflow:auto}
.slideshow .slide h1{font-size:40px;font-weight:600;margin:0 0 24px;letter-spacing:-.02em;line-height:1.1}
.slideshow .slide ul{font-size:22px;line-height:1.8;margin:0 0 0 4px}
.slideshow .slide li{margin:10px 0}
.slideshow .slideex{margin-top:24px;border-top:1px solid var(--line);padding:18px 0 0;font-size:20px}
.slideshow .slideex .ws-ex-lab{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:0;margin-bottom:6px}
.slideshow .slidememe{margin-top:22px;font-size:16px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.slideshow .sfoot{display:flex;justify-content:space-between;align-items:center;padding:9px 24px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);flex:none}
.slideshow .slidenav{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);flex:none}
.docmeta{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:14px;font-size:13px}

/* ---- worksheet in Robert's real style ---- */
.wsheet{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:30px 34px;color:#1b1a18}
.wsheet .ws-title{text-align:center;font-size:20px;font-weight:750;letter-spacing:-.01em;margin:0}
.wsheet .ws-name{display:flex;justify-content:space-between;gap:18px;font-size:12.5px;color:#555;border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin:10px 0 16px}
.wsheet .ws-instr{font-style:italic;color:#444;margin:0 0 16px}
.ws-sec{margin:20px 0}
.ws-sec-h{font-size:14px;font-weight:750;color:var(--ink);display:flex;align-items:center;gap:9px;margin:0 0 10px}
.ws-sec-h .ws-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--clay);border-radius:5px;padding:3px 8px;flex:none}
.ws-ex{background:#faf6f0;border:1px solid #ecdfd2;border-left:4px solid var(--clay);border-radius:9px;padding:12px 16px;margin:0 0 12px}
.ws-ex .ws-ex-lab{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--clay-d);margin-bottom:5px}
.ws-divider{border:none;border-top:1.5px solid var(--ink);margin:4px 0 12px}
.ws-directions{font-weight:750;margin:0 0 12px;font-size:13.5px}
.ws-cols{column-count:2;column-gap:30px}
@media(max-width:620px){.ws-cols{column-count:1}}
.ws-q{break-inside:avoid;margin:0 0 6px;padding-bottom:8px}
.ws-q .ws-num{font-weight:800;color:var(--clay-d);margin-right:7px}
.ws-q .ws-body{font-weight:500}
.ws-q.chili .ws-num::after{content:" 🌶";font-size:11px}
.ws-work{height:62px;border-bottom:1px solid #ddd6c9;margin-top:6px;background:repeating-linear-gradient(transparent,transparent 19px,#f0ece2 19px,#f0ece2 20px)}
.ws-work.ws-work-s{height:40px}
.ws-work.ws-work-l{height:104px}
.ws-ansline{margin-top:7px;font-size:12.5px;color:#666}
.ws-ansline .ws-box{display:inline-block;width:110px;border-bottom:1.5px solid #888;margin-left:6px;vertical-align:middle}
/* corner answer grid ("scantron") — final answers in one box for fast grading */
.ws-scantron{border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px;margin:0 0 16px;background:#fcfbf8}
.ws-scantron-t{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:7px}
.ws-scantron-grid{display:flex;flex-wrap:wrap;gap:7px 16px}
.ws-cell{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;min-width:84px}
.ws-cell b{color:var(--clay-d)}
.ws-cell .ws-blank{display:inline-block;flex:1;min-width:44px;border-bottom:1px solid #888;height:15px}
.ws-cell.mc{gap:3px}.ws-cell .bub{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border:1.3px solid #888;border-radius:50%;font-size:10px;color:#555}
.ws-challenge{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.ws-challenge .ws-sec-h .ws-tag{background:var(--gold);color:#5a3d05}

/* ---- slide cards + presentation — flat Claude-design aesthetic (one restrained accent, no gradients) ---- */
.slidecard{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0;background:#fff;box-shadow:none}
.slidecard.k-example{border-left:3px solid var(--clay)}
.slidecard .sc-bar{display:none}
.slidecard .sc-body{padding:18px 22px}
.slidecard .sc-num{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0}
.slidecard h4{font-size:19px;font-weight:600;margin:5px 0 10px;letter-spacing:-.01em;color:var(--ink)}
.slidecard ul{margin:6px 0 0 18px}
.slidecard li{margin:6px 0;font-size:15px;line-height:1.55}
.sc-ex{margin-top:14px;border-top:1px solid var(--line);padding:14px 0 0;font-size:14.5px}
.sc-ex .ws-ex-lab{font-size:11px;font-weight:600;letter-spacing:0;color:var(--muted);margin-bottom:5px}
.sc-meme{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.sc-meme b{color:var(--ink);font-weight:600}
.sc-meme a{font-weight:600}

/* ---- teacher daily guide ---- */
.tguide{background:linear-gradient(180deg,#fffdf9,#fbf7f0);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px;margin-bottom:18px}
.tguide h2{font-size:18px;margin:0 0 2px}
.tguide .tg-sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.tg-flow{list-style:none;margin:0;padding:0}
.tg-flow li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f0ece3;align-items:flex-start}
.tg-flow li:last-child{border-bottom:none}
.tg-time{flex:none;width:54px;font-weight:700;color:var(--clay-d);font-size:12.5px;padding-top:1px}
.tg-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tg-chip{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--ink)}
.tg-chip b{color:var(--clay-d)}
.tg-lock{margin-top:12px}
.tg-step{flex:1}
.tg-step-t{font-weight:700;font-size:13.5px}
.tg-do{font-size:13px;margin-top:2px}
.tg-say{font-size:12.5px;color:var(--green);margin-top:4px}
.tg-opts{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.tg-opts .ol{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tg-opt{font-size:12px;background:#f4f1ea;border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:#4a463d}
.tg-opt b{color:var(--clay-d)}

/* ---- tidier day toolbar (More ▾ disclosure) ---- */
.toolmore[open] .toolmore-sum{color:var(--clay-d)}
.toolmore-sum{cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--muted);padding:7px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;display:inline-block}
.toolmore-sum::-webkit-details-marker{display:none}
.toolmore-sum:hover{border-color:var(--clay);color:var(--clay-d)}
.toolmore .toolmore-body{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fbfaf7}

/* AI box */
.aibox{border:1px solid var(--line);background:#fbf8f3;border-radius:var(--radius-sm);padding:14px;margin-top:14px}
.aibox .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px}
.chip:hover{border-color:var(--clay);color:var(--clay-d)}
/* day-menu pick chips */
.pchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;margin:3px 5px 3px 0;cursor:pointer;vertical-align:middle;transition:background .12s,border-color .12s}
.pchip:hover{border-color:var(--clay)}
.pchip.on{background:var(--clay-soft);border-color:var(--clay);color:var(--clay-d)}
.pchip input{width:auto;margin:0;accent-color:var(--clay)}
.pchip .psum{font-size:11px;font-weight:500;color:var(--muted)}
.pchip.on .psum{color:var(--clay-d)}
.pchip.teacher{border-style:dashed;opacity:.9}

.spinner{display:inline-block;width:15px;height:15px;border:2px solid var(--clay-soft);border-top-color:var(--clay);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:13.5px;box-shadow:var(--shadow);z-index:200;opacity:0;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.note{background:#fbf3e8;border:1px solid #ecd9b8;border-radius:var(--radius-sm);padding:10px 13px;font-size:12.5px;color:#7a5a1e}
.overlay{position:fixed;inset:0;background:rgba(30,25,20,.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal{background:var(--panel);border-radius:var(--radius);box-shadow:0 24px 70px rgba(0,0,0,.35);padding:22px 24px;max-width:700px;width:100%;max-height:90vh;overflow:auto}
.modal textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.45}
.step{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--clay);color:#fff;font-size:12px;font-weight:700;align-items:center;justify-content:center;margin-right:6px}

/* print */
@media print{
  header.app,nav,.no-print,.toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:none;margin:0;padding:0}
  body.print-mode *{visibility:hidden}
  body.print-mode .print-target,body.print-mode .print-target *{visibility:visible}
  body.print-mode .print-target{position:absolute;left:0;top:0;width:100%}
  .lp td,.lp th{font-size:10.5px}
  .workspace{height:90px}
}
</style>
<style>/* deck.css — design-standard presentation deck (inline preview + fullscreen projector).
   Scoped under .deck / .deckshow so it never collides with the app's clay theme. */
.deck,.deckshow{--dk-card:#fff;--dk-ink:#0E1330;--dk-ink2:#1B2350;--dk-muted:#5A6382;--dk-line:#E4E9F5;
  --dk-indigo:#383CC1;--dk-indigo-soft:#EAEBFB;--dk-indigo-line:#D5D9F5;--dk-peri:#A9B0FF;--dk-gold:#E7B449;
  --dk-amber:#8A5300;--dk-amber-bg:#FBF1DF;--dk-amber-line:#EAD4A6;
  --dk-pine:#0B6E4F;--dk-pine-bg:#E6F4EE;--dk-pine-line:#BCE2D2;
  --dk-rose:#AF1235;--dk-rose-bg:#FBE8ED;--dk-rose-line:#F0C1CD;
  --dk-serif:Georgia,'Times New Roman',serif;--dk-sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--dk-mono:ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace}

/* ---------- one slide (shared by inline + fullscreen) ---------- */
.dslide{position:relative;background:var(--dk-card);border:1px solid var(--dk-line);border-radius:16px;overflow:hidden;color:var(--dk-ink);font-family:var(--dk-sans)}
.dslide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--dk-indigo)}
.dslide[data-t="hook"]::before,.dslide[data-t="recap"]::before{background:var(--dk-gold)}
.dslide[data-t="mistake"]::before{background:var(--dk-rose)}
.dslide[data-t="youtry"]::before,.dslide[data-t="wedo"]::before{background:var(--dk-pine)}
.dslide[data-t="vocab"]::before,.dslide[data-t="roadmap"]::before{background:linear-gradient(180deg,var(--dk-indigo),var(--dk-gold))}
.dbody{padding:20px 24px 22px 30px}
.dtop{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.deyebrow{font-family:var(--dk-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--dk-indigo)}
.dslide[data-t="mistake"] .deyebrow{color:var(--dk-rose)}
.dslide[data-t="youtry"] .deyebrow,.dslide[data-t="wedo"] .deyebrow{color:var(--dk-pine)}
.dslide[data-t="hook"] .deyebrow,.dslide[data-t="recap"] .deyebrow{color:var(--dk-amber)}
.dnum{margin-left:auto;font-family:var(--dk-mono);font-size:11px;color:var(--dk-muted)}
.dh{font-family:var(--dk-serif);font-weight:700;font-size:24px;line-height:1.08;letter-spacing:-.01em;color:var(--dk-ink);margin:0 0 12px;text-wrap:balance}
.dcols{display:flex;gap:20px;align-items:flex-start}
.dmain{flex:1;min-width:0}
.dgraphwrap{flex:none;width:300px}
.dbul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.dbul li{position:relative;padding-left:20px;font-size:15.5px;line-height:1.5;color:var(--dk-ink2)}
.dbul li::before{content:'';position:absolute;left:2px;top:8px;width:7px;height:7px;border-radius:2px;background:var(--dk-indigo);transform:rotate(45deg)}
.dpanel{margin-top:14px;border-radius:12px;padding:13px 16px;border:1px solid var(--dk-line)}
.dpanel:first-child{margin-top:0}
.dpanel .plab{font-family:var(--dk-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.dpanel .pbody{font-size:15px;line-height:1.5;color:var(--dk-ink)}
.dpanel.ex{background:var(--dk-indigo-soft);border-color:var(--dk-indigo-line)}.dpanel.ex .plab{color:var(--dk-indigo)}
.dpanel.mis{background:var(--dk-rose-bg);border-color:var(--dk-rose-line)}.dpanel.mis .plab{color:var(--dk-rose)}
.dpanel.you{background:var(--dk-pine-bg);border-color:var(--dk-pine-line)}.dpanel.you .plab{color:var(--dk-pine)}
.dpanel.note{background:var(--dk-amber-bg);border-color:var(--dk-amber-line)}.dpanel.note .plab{color:var(--dk-amber)}
.dvocab{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
.dchip{background:#fff;border:1px solid var(--dk-line);border-left:3px solid var(--dk-indigo);border-radius:9px;padding:9px 13px;font-size:14px;line-height:1.35;color:var(--dk-ink2)}
.dchip b{color:var(--dk-indigo);font-family:var(--dk-serif);font-size:15px}
.dgraph{background:#fff;border:1px solid var(--dk-line);border-radius:12px;padding:8px}
.dgraph svg{display:block;width:100%;height:auto}
.dgcap{font-family:var(--dk-mono);font-size:10px;color:var(--dk-muted);text-align:center;margin-top:5px;letter-spacing:.02em}
.dvideo{margin-top:14px;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600}
.dvideo .vic{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--dk-indigo);color:#fff;font-size:11px}
.dvideo a{color:var(--dk-indigo)}
.dmeme{margin-top:16px;font-size:13.5px;color:var(--dk-muted);border-top:1px dashed var(--dk-line);padding-top:11px}
.dmeme b{color:var(--dk-ink)}
.dslide .katex{font-size:1.02em}

/* ---------- inline preview (in the day view) ---------- */
.deck{display:flex;flex-direction:column;gap:14px;margin:12px 0}
.deck .dslide{box-shadow:0 14px 34px -26px rgba(14,19,48,.55)}

/* ---------- fullscreen projector ---------- */
.deckshow{position:fixed;inset:0;z-index:400;display:flex;flex-direction:column;
  background:radial-gradient(120% 130% at 82% -12%,#232a63 0%,#0E1330 58%)}
.deckbar{height:4px;background:rgba(255,255,255,.14);flex:none}
.deckbar .f{height:100%;background:linear-gradient(90deg,var(--dk-indigo),var(--dk-gold));transition:width .25s}
.deckstage{flex:1;display:flex;align-items:center;justify-content:center;padding:26px;min-height:0}
.deckshow .dslide{width:min(1140px,94vw);max-height:86vh;overflow:auto;border:none;box-shadow:0 34px 90px -34px rgba(0,0,0,.75)}
.deckshow .dbody{padding:40px 52px 44px 60px}
.deckshow .dslide::before{width:9px}
.deckshow .deyebrow{font-size:13px}
.deckshow .dnum{font-size:13px}
.deckshow .dh{font-size:42px;margin-bottom:22px}
.deckshow .dbul{gap:15px}
.deckshow .dbul li{font-size:24px;padding-left:30px;line-height:1.42}
.deckshow .dbul li::before{top:12px;width:10px;height:10px}
.deckshow .dcols{gap:34px}
.deckshow .dgraphwrap{width:420px}
.deckshow .dpanel{padding:20px 24px;margin-top:22px;border-radius:14px}
.deckshow .dpanel .plab{font-size:13px;margin-bottom:7px}
.deckshow .dpanel .pbody{font-size:22px;line-height:1.45}
.deckshow .dchip{font-size:19px;padding:12px 17px}.deckshow .dchip b{font-size:21px}
.deckshow .dvocab{gap:12px}
.deckshow .dvideo{font-size:21px}.deckshow .dvideo .vic{width:34px;height:34px;font-size:14px}
.deckshow .dmeme{font-size:17px;margin-top:22px;padding-top:15px}
.deckshow .dgcap{font-size:12px}
.deckfoot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 26px;color:#AEB6E0;font-family:var(--dk-mono);font-size:13px}
.deckfoot .dtitle{color:#E7EAF7}
.deckfoot .btn{font-family:var(--dk-sans)}
.decknav{display:flex;gap:10px;align-items:center}
.deckbtn{font-family:var(--dk-sans);font-size:14px;font-weight:600;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#E7EAF7;padding:8px 16px;cursor:pointer}
.deckbtn.primary{background:var(--dk-indigo);border-color:var(--dk-indigo)}
.deckbtn:hover{border-color:var(--dk-peri)}
</style>

<script>/* ============================================================================
   deck-plot.js — drawn SVG graphs + slide renderer for the design-standard deck.
   Reused by the app (window.md / window.esc take over) and the standalone demo.
   ========================================================================== */
(function(g){
  const esc = g.esc || (s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"));
  function mdLite(s){
    s=String(s==null?"":s); const keep=[];
    s=s.replace(/\$[^$]*\$/g,x=>{keep.push(x);return "␀"+(keep.length-1)+"␀";});
    s=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
    s=s.replace(/␀(\d+)␀/g,(_,i)=>keep[+i]);
    return s;
  }
  const MD = ()=> (g.md || mdLite);

  /* ---- safe expression -> function ---- */
  function compileExpr(expr){
    try{
      let s=String(expr==null?"":expr).toLowerCase().trim(); if(!s) return null;
      s=s.replace(/\^/g,"**");
      s=s.replace(/\b(asin|acos|atan|sin|cos|tan|sqrt|abs|exp|log10|log2|log|ln|cbrt|sign|floor|ceil|round|min|max|pow)\b/g,
        m=> m==="ln"?"Math.log": m==="log"?"Math.log10": m==="log2"?"Math.log2": "Math."+m);
      s=s.replace(/\bpi\b/g,"Math.PI").replace(/(^|[^a-z.])e($|[^a-z.])/g,"$1Math.E$2");
      s=s.replace(/(\d)\s*([x(])/g,"$1*$2").replace(/\)\s*(\()/g,")*$1").replace(/x\s*(\()/g,"x*$1").replace(/\)\s*x/g,")*x");
      const check=s.replace(/Math\.\w+/g,"").replace(/\bMath\b/g,"").replace(/\bx\b/g,"");
      if(/[a-z]/i.test(check)) return null;
      const f=new Function("x","return ("+s+");");
      f(0.31); // smoke
      return x=>{try{const y=f(x);return (typeof y==="number"&&isFinite(y))?y:NaN;}catch(e){return NaN;}};
    }catch(e){return null;}
  }

  const IND="#383CC1", GOLD="#C48A1A", AX="#5A6382", GRID="#E1E6F3", DOT="#383CC1", INK="#1B2350", MUT="#8A90B0";
  const num=(v,d)=>{v=+v;return isFinite(v)?v:d;};
  const niceStep=r=>{ if(!(r>0))return 1; const raw=r/8, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p; return (n<1.5?1:n<3.5?2:n<7.5?5:10)*p; };

  /* ---- plotSvg(spec) -> <svg> string. spec: {kind,...params} | "expr" | raw <svg> ---- */
  function plotSvg(spec){
    if(!spec) return "";
    if(typeof spec==="string"){ if(/^\s*<svg/i.test(spec)) return spec; spec={kind:"curve",expr:spec}; }
    const W=340,H=248,pad=24;
    let dom=spec.domain||spec.xrange||[-5,5]; let xmin=num(dom[0],-5), xmax=num(dom[1],5);
    if(xmax<=xmin){xmin=-5;xmax=5;}
    const k=(spec.kind||"curve").toLowerCase();
    const series=[]; let circle=null, pts=null;
    const push=(f,color)=>series.push({f,color:color||IND});
    if(k==="line"){ push(x=>num(spec.m,1)*x+num(spec.b,0)); }
    else if(k==="parabola"||k==="quadratic"){ const a=num(spec.a,1),b=num(spec.b,0),c=num(spec.c,0); push(x=>a*x*x+b*x+c); }
    else if(k==="cubic"){ const a=num(spec.a,1),b=num(spec.b,0),c=num(spec.c,0),d=num(spec.d,0); push(x=>a*x*x*x+b*x*x+c*x+d); }
    else if(k==="abs"){ const a=num(spec.a,1),h=num(spec.h,0),kk=num(spec.k,0); push(x=>a*Math.abs(x-h)+kk); }
    else if(k==="sqrt"){ const a=num(spec.a,1),h=num(spec.h,0),kk=num(spec.k,0); push(x=> (x-h)>=0? a*Math.sqrt(x-h)+kk : NaN); }
    else if(k==="exp"){ const a=num(spec.a,1),b=num(spec.b,2),kk=num(spec.k,0); push(x=>a*Math.pow(b,x)+kk); }
    else if(k==="log"){ const b=num(spec.b,Math.E),h=num(spec.h,0),kk=num(spec.k,0); push(x=> (x-h)>0? Math.log(x-h)/Math.log(b)+kk : NaN); }
    else if(k==="sin"){ const a=num(spec.a,1),b=num(spec.b,1),c=num(spec.c,0),d=num(spec.d,0); push(x=>a*Math.sin(b*x+c)+d); }
    else if(k==="cos"){ const a=num(spec.a,1),b=num(spec.b,1),c=num(spec.c,0),d=num(spec.d,0); push(x=>a*Math.cos(b*x+c)+d); }
    else if(k==="tan"){ const a=num(spec.a,1),b=num(spec.b,1); push(x=>a*Math.tan(b*x)); }
    else if(k==="circle"){ circle={h:num(spec.h,0),k:num(spec.k,0),r:Math.abs(num(spec.r,3))}; }
    else if(k==="points"||k==="scatter"){ pts=(spec.pts||spec.points||[]).map(p=>[+p[0],+p[1]]).filter(p=>isFinite(p[0])&&isFinite(p[1])); }
    else { const f=compileExpr(spec.expr); if(f) push(f); }
    if(spec.expr2){ const f2=compileExpr(spec.expr2); if(f2) push(f2,GOLD); }

    const steps=200, xs=[]; for(let i=0;i<=steps;i++) xs.push(xmin+(xmax-xmin)*i/steps);
    const data=series.map(se=>({color:se.color, pts:xs.map(x=>[x,se.f(x)])}));

    let ymin, ymax;
    if(spec.yrange){ ymin=num(spec.yrange[0],-5); ymax=num(spec.yrange[1],5); }
    else{
      ymin=Infinity; ymax=-Infinity;
      data.forEach(se=>se.pts.forEach(p=>{ if(isFinite(p[1])){ if(p[1]<ymin)ymin=p[1]; if(p[1]>ymax)ymax=p[1]; } }));
      if(circle){ ymin=Math.min(ymin,circle.k-circle.r); ymax=Math.max(ymax,circle.k+circle.r); xmin=Math.min(xmin,circle.h-circle.r); xmax=Math.max(xmax,circle.h+circle.r); }
      if(pts&&pts.length){ pts.forEach(p=>{ if(p[1]<ymin)ymin=p[1]; if(p[1]>ymax)ymax=p[1]; }); }
      if(!isFinite(ymin)||!isFinite(ymax)){ ymin=-5; ymax=5; }
      if(ymax-ymin>44){ ymax=Math.min(ymax,22); ymin=Math.max(ymin,-22); }
      const p=(ymax-ymin)*0.14||1; ymin-=p; ymax+=p;
      if(ymin>0) ymin=Math.min(ymin,-0.6); if(ymax<0) ymax=Math.max(ymax,0.6);
    }
    if(ymax<=ymin){ymin-=1;ymax+=1;}

    const X=x=>pad+(x-xmin)/(xmax-xmin)*(W-2*pad);
    const Y=y=>H-pad-(y-ymin)/(ymax-ymin)*(H-2*pad);
    const sx=niceStep(xmax-xmin), sy=niceStep(ymax-ymin);
    let out='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Consolas,monospace">';
    out+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fff"/>';
    let grid="";
    for(let gx=Math.ceil(xmin/sx)*sx; gx<=xmax+1e-9; gx+=sx){ const px=X(gx); grid+='<line x1="'+px.toFixed(1)+'" y1="'+pad+'" x2="'+px.toFixed(1)+'" y2="'+(H-pad)+'" stroke="'+GRID+'" stroke-width="1"/>'; }
    for(let gy=Math.ceil(ymin/sy)*sy; gy<=ymax+1e-9; gy+=sy){ const py=Y(gy); grid+='<line x1="'+pad+'" y1="'+py.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+py.toFixed(1)+'" stroke="'+GRID+'" stroke-width="1"/>'; }
    out+=grid;
    const y0inside=(0>=ymin&&0<=ymax), x0inside=(0>=xmin&&0<=xmax);
    const axY=y0inside?Y(0):(0<ymin?H-pad:pad), axX=x0inside?X(0):(0<xmin?pad:W-pad);
    out+='<line x1="'+pad+'" y1="'+axY.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+axY.toFixed(1)+'" stroke="'+AX+'" stroke-width="1.6"/>';
    out+='<line x1="'+axX.toFixed(1)+'" y1="'+pad+'" x2="'+axX.toFixed(1)+'" y2="'+(H-pad)+'" stroke="'+AX+'" stroke-width="1.6"/>';
    let labels="";
    for(let gx=Math.ceil(xmin/sx)*sx; gx<=xmax+1e-9; gx+=sx){ if(Math.abs(gx)<1e-9)continue; const px=X(gx); labels+='<text x="'+px.toFixed(1)+'" y="'+(axY+12).toFixed(1)+'" fill="'+MUT+'" font-size="9" text-anchor="middle">'+(Math.round(gx*100)/100)+'</text>'; }
    for(let gy=Math.ceil(ymin/sy)*sy; gy<=ymax+1e-9; gy+=sy){ if(Math.abs(gy)<1e-9)continue; const py=Y(gy); labels+='<text x="'+(axX-5).toFixed(1)+'" y="'+(py+3).toFixed(1)+'" fill="'+MUT+'" font-size="9" text-anchor="end">'+(Math.round(gy*100)/100)+'</text>'; }
    out+=labels;
    data.forEach(se=>{
      let d="", pen=false, prevY=null;
      se.pts.forEach(p=>{
        const x=p[0], y=p[1];
        if(!isFinite(y)){ pen=false; prevY=null; return; }
        const py=Y(y);
        if(pen && prevY!=null && Math.abs(py-prevY)>H*0.9){ pen=false; }
        d += (pen?" L":" M")+X(x).toFixed(1)+" "+Math.max(-40,Math.min(H+40,py)).toFixed(1);
        pen=true; prevY=py;
      });
      if(d) out+='<path d="'+d.trim()+'" fill="none" stroke="'+se.color+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    if(circle){ out+='<ellipse cx="'+X(circle.h).toFixed(1)+'" cy="'+Y(circle.k).toFixed(1)+'" rx="'+(Math.abs(X(circle.h+circle.r)-X(circle.h))).toFixed(1)+'" ry="'+(Math.abs(Y(circle.k+circle.r)-Y(circle.k))).toFixed(1)+'" fill="none" stroke="'+IND+'" stroke-width="2.6"/>'; }
    if(pts){ pts.forEach(p=>{ out+='<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="3.6" fill="'+DOT+'"/>'; }); }
    (spec.marks||[]).forEach(mk=>{ const mx=num(mk.x,0),my=num(mk.y,0); out+='<circle cx="'+X(mx).toFixed(1)+'" cy="'+Y(my).toFixed(1)+'" r="4" fill="#fff" stroke="'+GOLD+'" stroke-width="2.4"/>'; if(mk.label) out+='<text x="'+(X(mx)+7).toFixed(1)+'" y="'+(Y(my)-7).toFixed(1)+'" fill="'+INK+'" font-size="10.5" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.4" stroke-linejoin="round">'+esc(mk.label)+'</text>'; });
    out+='</svg>';
    return out;
  }

  /* ---- one slide's inner HTML ---- */
  const EYE={hook:"Hook",define:"New concept",example:"Worked example",mistake:"Watch out",youtry:"You try",vocab:"Vocabulary",wedo:"We do — together",roadmap:"Where we're headed",recap:"Recap",video:"Watch"};
  function slideBody(s,i,n){
    s=s||{}; const md=MD(); const t=(s.type||"").toLowerCase();
    const mdL=x=>String(x==null?"":x).split(/\n/).map(l=>md(l)).join("<br>");
    const eyebrow=esc(s.eyebrow||EYE[t]||"Slide");
    const main=[];
    if((s.bullets||[]).length) main.push('<ul class="dbul">'+s.bullets.map(b=>'<li>'+md(b)+'</li>').join("")+'</ul>');
    if(s.example) main.push('<div class="dpanel ex"><div class="plab">Worked example</div><div class="pbody">'+mdL(s.example)+'</div></div>');
    if(s.mistake) main.push('<div class="dpanel mis"><div class="plab">Common mistake</div><div class="pbody">'+mdL(s.mistake)+'</div></div>');
    const yt=s.youTry||s.youtry; if(yt) main.push('<div class="dpanel you"><div class="plab">You try</div><div class="pbody">'+mdL(yt)+'</div></div>');
    if(s.note) main.push('<div class="dpanel note"><div class="plab">Keep in mind</div><div class="pbody">'+mdL(s.note)+'</div></div>');
    if((s.vocab||[]).length) main.push('<div class="dvocab">'+s.vocab.map(x=>'<span class="dchip"><b>'+esc(x.term||"")+'</b>'+(x.definition?' — '+esc(x.definition):'')+'</span>').join("")+'</div>');
    const vid=s.video; if(vid&&(vid.url||vid.title)) main.push('<div class="dvideo"><span class="vic">&#9654;</span><a href="'+esc(vid.url||"#")+'" target="_blank" rel="noopener">'+esc(vid.title||"Watch this")+'</a></div>');
    const g2=s.graph?('<div class="dgraphwrap"><div class="dgraph">'+plotSvg(s.graph)+'</div>'+(s.graphCaption?'<div class="dgcap">'+esc(s.graphCaption)+'</div>':'')+'</div>'):'';
    const body=g2?('<div class="dcols"><div class="dmain">'+main.join("")+'</div>'+g2+'</div>'):main.join("");
    const meme=s.meme?'<div class="dmeme"><b>Lighter note:</b> '+esc(s.meme)+'</div>':'';
    const dnum=n?'<span class="dnum">'+(i+1)+' / '+n+'</span>':'';
    return '<div class="dbody"><div class="dtop"><span class="deyebrow">'+eyebrow+'</span>'+dnum+'</div><h2 class="dh">'+esc(s.heading||"")+'</h2>'+body+meme+'</div>';
  }
  function slideEl(s,i,n){ return '<div class="dslide" data-t="'+esc((s.type||"").toLowerCase())+'">'+slideBody(s,i,n)+'</div>'; }

  g.compileExpr=compileExpr; g.plotSvg=plotSvg; g.slideBody=slideBody; g.slideEl=slideEl;
})(typeof window!=="undefined"?window:globalThis);
</script>
<main style="max-width:840px;margin:0 auto;padding:22px">
  <div class="card"><h2 style="margin-top:0">Wed · Quadratic Functions</h2>
  <div class="btnbar" style="margin:16px 0 4px;align-items:center"><h3 style="margin:0;flex:1">Launch deck <span class="pill gold">week opener</span></h3></div>
  <div class="deck" id="d"></div></div>

ab":[{"term":"Parabola","definition":"the U-shaped graph of a quadratic"},{"term":"Vertex","definition":"the highest or lowest point"},{"term":"Axis of symmetry","definition":"the vertical line through the vertex"},{"term":"Zeros / roots","definition":"where the graph crosses the x-axis"},{"term":"Standard form","definition":"$f(x)=ax^2+bx+c$"}]},{"type":"roadmap","heading":"Where we're headed this week","bullets":["**Mon** — graph from standard form (today).","**Tue** — vertex form and transformations.","**Wed** — solve by factoring & the quadratic formula.","**Thu** — real-world max/min (projectile & profit).","**Fri** — quiz + a modeling challenge."],"video":{"title":"Warm-up video: parabolas in real life (3 min)","url":"https://www.youtube.com/results?search_query=parabolas+in+real+life"}}];
